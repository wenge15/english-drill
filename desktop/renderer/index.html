<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>英语练习 · English Drill</title>
<!-- 内联 SVG 图标：避免浏览器去请求 /favicon.ico。
     那个请求会被 token 校验拦下（返回 403），在控制台留一条红字错误，
     看起来像软件出问题了。内联图标零请求、零报错。 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f8cff'/%3E%3Ctext x='16' y='23' font-size='19' font-family='Segoe UI,sans-serif' font-weight='700' fill='%23fff' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c232c; --line:#28313c;
    --fg:#e8edf4; --muted:#8b98a8; --accent:#4f8cff; --accent2:#7aa9ff;
    --ok:#35c88a; --warn:#e8b23a; --crit:#f0603c; --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.65 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;overflow:hidden}
  #app{display:flex;height:100vh}

  /* 侧栏 */
  aside{width:196px;flex:0 0 196px;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;padding:16px 10px}
  .brand{font-size:15px;font-weight:700;letter-spacing:.3px;padding:0 8px 14px;color:var(--fg)}
  .brand small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;letter-spacing:0}
  nav{display:flex;flex-direction:column;gap:4px}
  nav button{display:flex;align-items:center;gap:9px;background:transparent;border:0;color:var(--muted);
    text-align:left;padding:10px 12px;border-radius:9px;cursor:pointer;font-size:13.5px;width:100%}
  nav button:hover{background:var(--panel2);color:var(--fg)}
  nav button.on{background:#1d2937;color:var(--accent2);font-weight:600}
  .navfoot{margin-top:auto;color:var(--muted);font-size:11.5px;padding:8px}
  .navfoot code{color:var(--accent2)}

  main{flex:1;overflow:auto;padding:26px 30px 60px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
  .card h2{font-size:14px;margin:0 0 12px;color:var(--muted);font-weight:600}
  button{cursor:pointer;font-family:inherit}
  .btn{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:10px 18px;font-size:14px;font-weight:500}
  .btn:hover{background:var(--accent2)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
  .btn.ghost:hover{color:var(--fg);border-color:#3a4654}
  .btn.danger{background:transparent;border:1px solid #4a2b26;color:#e08b78}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  input[type=text],input[type=password],input[type=number],select,textarea{
    background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;
    padding:9px 11px;font-size:13.5px;font-family:inherit;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  textarea{resize:vertical;min-height:70px;font-size:13px}
  label.fld{display:block;margin-bottom:12px}
  label.fld span{display:block;color:var(--muted);font-size:12.5px;margin-bottom:5px}

  /* 统计卡 */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
  .kpi{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .kpi b{display:block;font-size:23px;font-weight:650;line-height:1.25}
  .kpi span{color:var(--muted);font-size:12px}

  /* 练习 */
  .practice{max-width:780px;margin:0 auto}
  .ptop{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;margin-bottom:10px}
  /* 题号只在练习页出现，做成醒目但不抢眼的样子 */
  .qno{background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    padding:3px 11px;font-size:13.5px;color:var(--accent2);font-weight:650}
  .bar{height:5px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-bottom:22px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .25s}
  .stem{font-size:19px;line-height:1.75;margin-bottom:22px;white-space:pre-wrap;word-break:break-word}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;gap:13px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);
    border-radius:11px;padding:14px 16px;text-align:left;color:var(--fg);font-size:15px;transition:.12s}
  .opt:hover{border-color:#3d4d63;background:#1a2230}
  .opt .k{flex:0 0 26px;height:26px;border-radius:7px;background:var(--panel2);color:var(--muted);
    display:grid;place-items:center;font-weight:700;font-size:13px}
  .opt.picked{border-color:var(--accent);background:#1b2a43}
  .opt.picked .k{background:var(--accent);color:#fff}
  .opt.right{border-color:var(--ok);background:#16281f}
  .opt.right .k{background:var(--ok);color:#08231a}
  .opt.wrongpick{border-color:var(--crit);background:#2a1a17}
  .opt.wrongpick .k{background:var(--crit);color:#2a0d07}
  .opt:disabled{cursor:default}
  .opt .tag{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}

  /* 结果 */
  .score{text-align:center;padding:14px 0 20px}
  .score > b{font-size:52px;font-weight:700;line-height:1}
  .score .lbl{color:var(--muted);margin-top:6px}
  .kp{display:inline-block;background:#1d2937;color:var(--accent2);border-radius:99px;
    padding:3px 10px;font-size:12px;margin:2px 4px 2px 0}
  .kp.weak{background:#3a2418;color:#e8a97a}
  .find{border-left:3px solid var(--accent);background:var(--panel2);padding:10px 14px;border-radius:0 9px 9px 0;margin-bottom:9px}
  .find.crit{border-color:var(--crit)}
  .find.warn{border-color:var(--warn)}
  .find > b{display:block;margin-bottom:2px}
  .find .ex{color:var(--muted);font-size:12.5px;margin-top:5px}
  .find .pickedline{line-height:1.9}
  .find .pickedline b{font-weight:700}
  .center{text-align:center}
  .muted{color:var(--muted)}
  .crit{color:var(--crit)}
  .warnc{color:var(--warn)}
  .okc{color:var(--ok)}
  .empty{text-align:center;padding:50px 20px;color:var(--muted)}
  .drop{border:1.5px dashed var(--line);border-radius:12px;padding:34px;text-align:center;color:var(--muted);cursor:pointer}
  .drop:hover{border-color:var(--accent);color:var(--fg)}
  .thumb{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
  .qlist{max-height:520px;overflow:auto}
  .qitem{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:9px;background:var(--panel2)}
  .qitem .st{font-size:13.5px;margin-bottom:6px;white-space:pre-wrap}
  .qitem .meta{color:var(--muted);font-size:12px}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);
    border-top-color:var(--accent);border-radius:99px;animation:sp .7s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  /* 整包识别的文件名可点，点了看图核对 */
  .zipsrc{color:var(--accent2);text-decoration:none;border-bottom:1px dashed var(--accent2);cursor:pointer}
  .zipsrc:hover{color:#fff}
  /* 页内图片查看器 */
  #imgViewer{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center}
  #imgViewer .iv-backdrop{position:absolute;inset:0;background:#000c}
  #imgViewer .iv-panel{position:relative;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;box-shadow:0 20px 60px #000a;max-width:94vw;max-height:92vh;
    display:flex;flex-direction:column;overflow:hidden}
  #imgViewer .iv-head{display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:10px 14px;border-bottom:1px solid var(--line)}
  #imgViewer .iv-title{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #imgViewer .iv-body{position:relative;display:flex;align-items:center;gap:8px;padding:10px;min-height:200px}
  #imgViewer #ivImg{max-width:82vw;max-height:70vh;display:block;background:#fff;border-radius:6px;
    transition:opacity .15s}
  #imgViewer .iv-nav{border:1px solid var(--line);background:#1b2430;color:#dbe4ef;font-size:22px;
    line-height:1;width:34px;height:64px;border-radius:8px;cursor:pointer;flex:0 0 auto}
  #imgViewer .iv-nav:hover{border-color:var(--accent)}
  #imgViewer .iv-foot{padding:9px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#232c38;
    border:1px solid var(--line);padding:11px 18px;border-radius:10px;font-size:13.5px;z-index:99;
    box-shadow:0 8px 30px #0008;max-width:70vw}
  .toast.err{border-color:#5a2c24;color:#f0a08c}
  .toast.okc{border-color:#24513d;color:#8fe0b8}
  .warnbox{background:#2c2416;border:1px solid #4d3f1e;color:#e8c37a;border-radius:9px;padding:10px 13px;font-size:12.5px;margin-bottom:12px}
  .warnbox ul{margin:6px 0 0;padding-left:18px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:1000px){.grid2{grid-template-columns:1fr}}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600}
  .mb{height:9px;background:var(--panel2);border-radius:99px;overflow:hidden;min-width:70px;display:inline-block;vertical-align:middle}
  .mb i{display:block;height:100%;background:var(--ok)}
  .mb i.mid{background:var(--warn)} .mb i.low{background:var(--crit)}

  /* ---- 讲评（第二次做错时展开） ---- */
  .teach{border:1px solid #4a3a1e;background:#241f14;border-radius:10px;padding:14px;margin-top:8px}
  .teach h4{margin:0 0 10px;font-size:13.5px;color:var(--warn)}
  .history{display:flex;flex-direction:column;gap:6px;margin:8px 0}
  .hrow{display:flex;align-items:center;gap:10px;font-size:13px;background:var(--panel2);
    border-radius:8px;padding:7px 11px;border-left:3px solid var(--crit)}
  .hrow.ok{border-left-color:var(--ok)}
  .hrow .when{color:var(--muted);font-size:12px;min-width:96px}
  .hrow .what{flex:1}
  .hrow .mark{font-size:12px}

  /* ---- 对话面板 ---- */
  .chatwrap{display:flex;gap:14px;height:calc(100vh - 190px);min-height:380px}
  .chatlist{flex:0 0 220px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
  .chatlist .item{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12.5px}
  .chatlist .item:hover{background:var(--panel2)}
  .chatlist .item.on{background:#1d2937;color:var(--accent2)}
  .chatlist .item .sub{color:var(--muted);font-size:11.5px;margin-top:2px}
  .chatmain{flex:1;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
  .chathead{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .chathead .ctx{color:var(--muted);font-size:12px;flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:76%;padding:10px 13px;border-radius:12px;font-size:13.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
  .msg.user{align-self:flex-end;background:#1d3452;border:1px solid #2a4a72}
  .msg.assistant{align-self:flex-start;background:var(--panel2);border:1px solid var(--line)}
  .msg.error{border-color:#5a2c24;color:#f0a08c}
  .chatfoot{border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;align-items:flex-end}
  .chatfoot textarea{min-height:44px;max-height:120px;resize:none;flex:1}
  .ctxbox{font-size:12px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);
    border-radius:8px;padding:8px 11px;margin:0 16px 10px;max-height:120px;overflow:auto;white-space:pre-wrap}
  .chip{display:inline-block;background:#1d2937;color:var(--accent2);border-radius:99px;padding:2px 9px;font-size:11.5px;margin-right:5px}
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="brand">英语练习<small>English Drill</small></div>
    <nav id="nav">
      <button data-screen="today" class="on">📅 今日练习</button>
      <button data-screen="capture">✍️ 录入题目</button>
      <button data-screen="library">📚 题库管理</button>
      <button data-screen="groups">🗂️ 单元分组</button>
      <button data-screen="trash">🗑️ 回收站</button>
      <button data-screen="stats">📊 掌握情况</button>
      <button data-screen="chat">💬 问答</button>
      <button data-screen="settings">⚙️ 设置</button>
    </nav>
    <div class="navfoot" id="navfoot"></div>
  </aside>
  <main id="main"></main>
</div>

<script>
'use strict';
/* ------------------------------------------------------------------ *
 * 渲染进程：只通过 window.dsh.invoke 与后端通信，拿不到 Node。
 * 产品硬性要求：练习过程中绝不显示对错，全部练完才揭晓正确率。
 * ------------------------------------------------------------------ */

const INVOKE = async (channel, payload) => {
  if (!window.dsh) throw new Error('未连接到宿主（window.dsh 不存在）');
  return window.dsh.invoke(channel, payload);
};

/**
 * 二进制上传（整包 zip 用）。走宿主单独的通道，不做 base64 转换。
 * 宿主不支持时给出明确说明，而不是静默失败。
 */
const UPLOAD = async (channel, bytes, extraArgs) => {
  if (!window.dsh) throw new Error('未连接到宿主（window.dsh 不存在）');
  if (!window.dsh.upload) throw new Error('当前宿主不支持二进制上传，请重启程序后再试');
  return window.dsh.upload(channel, bytes, extraArgs);
};

/**
 * ZIP 上传上限。默认 200MB，启动后从 /api/health 读到真实值再覆盖
 * —— 避免前后端各写一个数字，改了一边忘了另一边。
 */
let ZIP_UPLOAD_LIMIT = 200 * 1024 * 1024;
(async () => {
  try {
    const r = await fetch('/api/health');
    const j = await r.json();
    if (j && j.uploadLimitBytes) ZIP_UPLOAD_LIMIT = j.uploadLimitBytes;
  } catch (e) {
    /* 读不到就用默认值，不影响使用 */
  }
})();

const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
/** 把作答字母显示成人话：'IDK' 表示用户点了「我不会」，其余原样，空则「未作答」。 */
const fmtPicked = (p) => (p === 'IDK' ? '我不会' : (p || '未作答'));

function toast(msg, kind = '') {
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), kind === 'err' ? 5200 : 2600);
}

/* ---------------------------- 路由 ---------------------------- */
const screens = {};
let current = 'today';

/* -------------------- 录入草稿（模块级状态） --------------------
 * pending / pendingSource 提升到模块级：切页面（go）不再重建
 * 录入页闭包，所以这些状态不会丢；再配合 localStorage
 * （capture-draft-v1）持久化，误触刷新/重启也不丢。
 *
 * 纯序列化/恢复与「不完整题统计」的逻辑抽在 src/core/draft.js（可单测），
 * 下面内联实现与之保持同等语义（前端是内联 JS，无构建，无法 require）。
 * ---------------------------------------------------------------- */
let pending = [];       // 待确认入库的题
let pendingSource = 'text';

/** 统计 incomplete===true 的题数，用于提醒用户核对补充（不是排除）。 */
function countIncomplete(list) {
  let n = 0;
  for (const q of list || []) {
    if (q && q.incomplete === true) n += 1;
  }
  return n;
}

const DRAFT_KEY = 'capture-draft-v1';
/** 每次 pending 变化后调用；写入失败（隐私模式）静默降级。 */
function saveDraft() {
  try {
    const state = { pending, pendingSource, savedAt: new Date().toISOString() };
    localStorage.setItem(DRAFT_KEY, JSON.stringify(state));
  } catch (e) { /* 隐私模式或写满：静默降级，不影响主流程 */ }
}
/** 入库成功后清除草稿。 */
function clearDraft() {
  try { localStorage.removeItem(DRAFT_KEY); } catch (e) { /* 忽略 */ }
}
/** 读取草稿；无效或为空返回 null。 */
function loadDraft() {
  try {
    const raw = localStorage.getItem(DRAFT_KEY);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (!obj || !Array.isArray(obj.pending)) return null;
    return {
      pending: obj.pending,
      pendingSource: typeof obj.pendingSource === 'string' ? obj.pendingSource : 'text',
      savedAt: obj.savedAt || null,
    };
  } catch (e) { return null; }
}

function go(name, ...args) {
  current = name;
  document.querySelectorAll('#nav button').forEach((b) => b.classList.toggle('on', b.dataset.screen === name));
  if (name === 'practice') {
    $('#main').innerHTML = '';
    practiceScreen(...args);
    return;
  }
  $('#main').innerHTML = '';
  screens[name](...args);
}
document.querySelectorAll('#nav button').forEach((b) => (b.onclick = () => go(b.dataset.screen)));

/* ---------------------------- 今日练习 ---------------------------- */
screens.today = async () => {
  const main = $('#main');
  main.innerHTML = `<h1>今日练习</h1><div class="sub" id="todaySub">正在检查今日任务…</div>
    <div class="kpis" id="todayKpis"></div>
    <div class="card" style="margin-top:18px"><h2>开始今天的练习</h2>
      <p class="muted" style="margin:0 0 14px">练习过程中不会告诉你对错，全部做完后才公布正确率，并带你重做错题。</p>
      <div class="row">
        <button class="btn" id="startBtn">开始练习</button>
        <button class="btn ghost" id="seedBtn">试用：导入 6 道示例题</button>
      </div>
      <div id="todayPicksNote"></div>
      <div id="pendingRetry"></div>
    </div>
    <div class="card"><h2>未来 7 天复习量</h2><div id="forecast" class="muted">—</div></div>
    <div class="card">
      <h2>考前集训</h2>
      <p class="muted" style="margin:0 0 12px">
        把你<b>所有做错过的题</b>排进一周内复习一遍 —— 错得最多的先排，保证一道都不漏。
      </p>
      <div class="kpis" id="sprintKpis" style="margin-bottom:14px"></div>
      <div class="row">
        <label class="fld" style="flex:0 0 130px;margin-bottom:0"><span>集中复习天数</span>
          <select id="sprintDays">
            <option value="3">3 天（突击）</option>
            <option value="5">5 天</option>
            <option value="7" selected>7 天（一周）</option>
            <option value="14">14 天（宽松）</option>
          </select></label>
        <label class="fld" style="flex:0 0 130px;margin-bottom:0"><span>每天最多</span>
          <select id="sprintCap">
            <option value="20">20 题</option>
            <option value="30">30 题</option>
            <option value="60" selected>60 题</option>
            <option value="120">120 题</option>
          </select></label>
        <button class="btn ghost" id="planSprint">查看排期计划</button>
        <button class="btn" id="startSprint">开始集训</button>
      </div>
      <div id="sprintPlan" style="margin-top:14px"></div>
    </div>`;

  const refreshSprint = async () => {
    const s = await INVOKE('sprint:status');
    if (!s.ok) return;
    $('#sprintKpis').innerHTML = [
      ['错过的题', s.totalWrong], ['已排期', s.scheduled], ['该复习了', s.dueNow], ['已攻克', s.conquered],
    ].map(([l, v]) => `<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join('');
    if (s.totalWrong === 0) {
      $('#startSprint').disabled = true;
      $('#planSprint').disabled = true;
      $('#sprintPlan').innerHTML = '<div class="muted">还没有做错过的题 —— 练几轮之后再来集训。</div>';
    } else {
      $('#startSprint').disabled = false;
      $('#planSprint').disabled = false;
    }
    if (s.lastSprint) {
      const when = new Date(s.lastSprint.appliedAt).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      $('#sprintPlan').innerHTML = `<div class="muted" style="font-size:12.5px">
        上次集训：${when} 排了 ${s.lastSprint.moved} 道题（${s.lastSprint.days} 天）。
      </div>`;
    }
  };

  const renderPlan = (p) => {
    if (p.empty) {
      $('#sprintPlan').innerHTML = `<div class="muted">${esc(p.message)}</div>`;
      return;
    }
    $('#sprintPlan').innerHTML = `
      <div class="hintbox">${esc(p.summary)}</div>
      <table><thead><tr><th>第几天</th><th>日期</th><th>题量</th><th>主要考点</th></tr></thead>
        <tbody>${p.plan.map((d) => `<tr>
          <td>第 ${d.dayIndex} 天</td><td>${esc(d.date)}</td><td>${d.count} 题</td>
          <td>${(d.knowledgePoints || []).slice(0, 4).map((k) => `<span class="chip">${esc(k)}</span>`).join('') || '<span class="muted">—</span>'}</td>
        </tr>`).join('')}</tbody></table>`;
  };

  $('#planSprint').onclick = async () => {
    const r = await INVOKE('sprint:plan', {
      days: Number($('#sprintDays').value),
      perDayCap: Number($('#sprintCap').value),
    });
    if (!r.ok) return toast(r.error, 'err');
    renderPlan(r);
    toast(r.empty ? r.message : r.summary, r.empty ? 'err' : 'okc');
  };

  $('#startSprint').onclick = async () => {
    const days = Number($('#sprintDays').value);
    const r = await INVOKE('sprint:quickStart', { days, perDayCap: Number($('#sprintCap').value) });
    if (!r.ok) return toast(r.error, 'err');
    if (r.empty) return toast(r.message, 'err');
    renderPlan(r.plan);
    toast(r.message, 'okc');
    refreshSprint();
    refresh();
  };

  const refresh = async () => {
    const [c, ov] = await Promise.all([INVOKE('questions:counts'), INVOKE('stats:overview')]);
    if (!c.ok) return;
    const k = c.counts;
    $('#todaySub').textContent = `${c.today}｜题库共 ${k.total} 题，其中已学过 ${k.learned} 题`;
    $('#todayKpis').innerHTML = [
      ['待复习', k.due], ['未学过', k.new], ['已学过', k.learned], ['题库总量', k.total],
    ].map(([l, v]) => `<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join('');
    if (ov.ok) {
      const max = Math.max(1, ...ov.forecast.map((f) => f.count));
      $('#forecast').innerHTML = ov.forecast.map((f) => {
        const pct = Math.round((f.count / max) * 100);
        return `<div class="row" style="margin-bottom:6px">
          <span class="muted" style="width:110px;font-size:12.5px">${esc(f.day)}</span>
          <span class="mb" style="width:220px"><i style="width:${pct}%" class="${pct > 66 ? 'low' : pct > 33 ? 'mid' : ''}"></i></span>
          <span style="font-size:13px">${f.count} 题</span></div>`;
      }).join('');
    }
    const counts = await INVOKE('questions:counts');
    $('#startBtn').disabled = counts.ok && counts.counts.total === 0;
    if ($('#startBtn').disabled) $('#startBtn').textContent = '题库为空，请先录入题目';
  };

  $('#seedBtn').onclick = async () => {
    const r = await INVOKE('demo:seed');
    toast(r.ok ? `已导入示例题：新增 ${r.created} 道` : r.error, r.ok ? 'okc' : 'err');
    refresh();
  };
  $('#startBtn').onclick = async () => {
    const r = await INVOKE('practice:start', {});
    if (!r.ok) return toast(r.error, 'err');
    if (r.empty) return toast(r.message, 'err');
    go('practice', r.session, r.resumed);
  };

  // 今日手选提示：用户在图库勾选「加入今日练习」的题会排在练习最前面。
  // 这里异步显示数量，让用户知道手选已生效（否则勾完没有任何反馈，容易以为没成功）。
  const checkTodayPicks = async () => {
    const box = $('#todayPicksNote');
    if (!box) return;
    const r = await INVOKE('practice:todayPicks');
    if (!r.ok || !r.total) { box.innerHTML = ''; return; }
    box.innerHTML = `<div class="hintbox" style="margin-top:12px">
      <b>今日手选 ${r.total} 道</b>：开始练习时会<b>排在最前面</b>。
      <span class="muted">（可在「题库管理」里勾选更多，或取消勾选）</span>
    </div>`;
  };

  // 「继续重做上次的错题」：结果页只在练习结束那一刻显示入口，关掉窗口后用户回不去。
  // 所以今日页异步查一次（不阻塞首屏），有未订正错题就给一个醒目入口。
  const checkPendingRetry = async () => {
    const box = $('#pendingRetry');
    if (!box) return;
    const r = await INVOKE('practice:pendingRetry');
    if (!r.ok || !r.retry) { box.innerHTML = ''; return; }
    const retry = r.retry;
    box.innerHTML = `<button class="btn" id="resumeRetryBtn" style="margin-top:12px;background:var(--warn);color:#2a1c00">继续重做上次的错题（${retry.wrongCount} 道）</button>`;
    $('#resumeRetryBtn').onclick = async () => {
      const rr = await INVOKE('practice:retry', { sessionId: retry.sessionId });
      if (!rr.ok) return toast(rr.error, 'err');
      if (rr.empty) {
        toast(rr.message || '错题已全部订正', 'okc');
        box.innerHTML = '';
        refresh();
        return;
      }
      go('practice', rr.session, Boolean(rr.resumed));
    };
  };

  refresh();
  refreshSprint();
  checkTodayPicks();
  checkPendingRetry();
};

/* ---------------------------- 练习流程 ---------------------------- */
async function practiceScreen(session, resumed) {
  const main = $('#main');
  let items = session.items;
  let idx = 0;
  let answered = {};
  let lastAnsweredIdx = -1; // 最近一次作答的题下标，用于「上一题」判断是否撤销

  // 续练时跳过已作答的题
  if (resumed) {
    for (const it of items) if (it.picked !== null) answered[it.questionId] = it.picked;
    const firstUnanswered = items.findIndex((it) => it.picked === null);
    idx = firstUnanswered === -1 ? items.length : firstUnanswered;
  }

  function render() {
    if (idx >= items.length) return renderFinish();
    const it = items[idx];
    const isAnswered = answered[it.questionId] !== undefined;
    const done = Object.keys(answered).length;
    const sh = session.shuffling || {};
    // 把当前的乱序状态明示出来，避免"改了设置却没生效"的猜测
    const shuffleNote = [
      sh.order ? '题目乱序' : '题目按录入顺序',
      sh.options ? '选项乱序' : '选项固定',
    ].join('｜');
    main.innerHTML = `<div class="practice">
      <div class="ptop">
        <span class="row" style="gap:8px">
          <b class="qno">第 ${idx + 1} 题</b>
          <span class="muted">/ 共 ${items.length} 题${session.round > 1 ? `（第 ${session.round} 轮·错题重做）` : ''}</span>
        </span>
        <span>已作答 ${done} 题</span>
      </div>
      <div class="bar"><i style="width:${(idx / items.length) * 100}%"></i></div>
      <div class="stem">${esc(it.stem)}</div>
      <div class="opts" id="opts">
        ${Object.entries(it.options).map(([k, v]) => `<button class="opt" data-k="${k}" ${isAnswered ? 'disabled' : ''}>
            <span class="k">${k}</span><span>${esc(v)}</span></button>`).join('')}
      </div>
      <div class="row" style="margin-top:12px;gap:8px;align-items:center">
        <button class="btn ghost" id="idkBtn" style="border-color:#4a2b26;color:#e08b78" ${isAnswered ? 'disabled' : ''}>我不会 / 不猜了</button>
        <span class="muted" style="font-size:12.5px">不确定就别猜，标记后计入错题</span>
        <button class="btn ghost" id="favBtn" style="margin-left:auto;font-size:12.5px">${it.favorite ? '★ 已收藏' : '☆ 收藏'}</button>
      </div>
      <div id="feedback"></div>
      <div class="row" style="margin-top:18px;justify-content:space-between">
        <span class="row" style="gap:8px;align-items:center">
          <button class="btn ghost" id="undoBtn" ${idx === 0 ? 'disabled' : ''}>上一题</button>
          <button class="btn ghost" id="nextBtn" ${idx >= items.length - 1 ? 'disabled' : ''}>下一题</button>
          <span class="muted" style="font-size:12.5px">选完直接进入下一题，练习中不提示对错（${esc(shuffleNote)}）</span>
        </span>
        <button class="btn ghost" id="quitBtn">结束本次</button>
      </div>
    </div>`;

    // 统一的作答入口：选项点击与「我不会」都走这里，避免两条路径行为分叉。
    const answerWith = async (picked) => {
      answered[it.questionId] = picked;
      const r = await INVOKE('practice:answer', { sessionId: session.id, questionId: it.questionId, picked });
      if (!r.ok) { toast(r.error, 'err'); return; }
      lastAnsweredIdx = idx;

      // 第二次（及以上）做错 → 在题目下方直接展开讲评与对话窗口
      const t = await INVOKE('teach:mistake', { questionId: it.questionId, sessionId: session.id });
      if (t.ok && t.wrongCount >= 2) {
        renderInlineTeach(it, picked, t, () => { idx += 1; render(); });
      } else {
        setTimeout(() => { idx += 1; render(); }, 180);
      }
    };

    $('#opts').querySelectorAll('.opt').forEach((btn) => {
      btn.onclick = async () => {
        const picked = btn.dataset.k;
        // 界面只记录选择，不做任何对错判断或高亮
        $('#opts').querySelectorAll('.opt').forEach((b) => { b.disabled = true; b.classList.remove('picked'); });
        btn.classList.add('picked');
        answerWith(picked);
      };
    });
    // 「我不会」= 记为错（picked='IDK'），照常进错题本/讲评，只是不做任何选项高亮
    $('#idkBtn').onclick = () => {
      $('#opts').querySelectorAll('.opt').forEach((b) => { b.disabled = true; b.classList.remove('picked'); });
      answerWith('IDK');
    };
    // 收藏：只是打标记，不泄露答案、不影响作答流程
    $('#favBtn').onclick = async () => {
      const next = !it.favorite;
      const r = await INVOKE('questions:setFavorite', { questionId: it.questionId, favorite: next });
      if (!r.ok) return toast(r.error, 'err');
      it.favorite = r.favorite;
      $('#favBtn').textContent = r.favorite ? '★ 已收藏' : '☆ 收藏';
      toast(r.favorite ? '已收藏' : '已取消收藏', 'okc');
    };

    // 上一题：退回上一题；若那一题是刚作答的则先撤销（可重选），否则仅退回查看（选项保持禁用）。
    $('#undoBtn').onclick = async () => {
      if (idx === 0) return;
      const prevIdx = idx - 1;
      const prev = items[prevIdx];
      if (lastAnsweredIdx === prevIdx) {
        const r = await INVOKE('practice:undoAnswer', { sessionId: session.id, questionId: prev.questionId });
        if (!r.ok) return toast(r.error || '撤销失败', 'err');
        delete answered[prev.questionId];
        lastAnsweredIdx = -1;
        toast('已撤销上一题的选择，可以重新作答', 'okc');
      }
      idx = prevIdx;
      render();
    };
    // 下一题：退回查看后前进；未作答就点下一题视为跳过（不算作答）。
    $('#nextBtn').onclick = () => {
      if (idx < items.length - 1) { idx += 1; render(); }
    };

    $('#quitBtn').onclick = () => renderFinish(true);
  }

  /**
   * 第二次做错时，在题目下方就地展开：正确答案 + 知识点 + 前几次选了什么 + 对话窗口。
   *
   * 为什么放在题目下方而不是弹窗：用户明确要求"在题目下方出现对话窗口"，
   * 这样能一边看着题目一边问，不用在两个窗口之间来回切。
   */
  function renderInlineTeach(it, picked, t, onNext) {
    const q = t.question;
    const feedback = $('#feedback');
    if (!feedback) return onNext();

    /**
     * 选项文字必须来自**本轮的冻结顺序**，绝不能来自当前题库。
     *
     * 真实 bug：练习里选项顺序每轮都打乱，而讲评以前用当前题库的 options
     * 去解释本轮的字母，于是出现"你选了 C · some other，正确答案是 C · some other"
     * 却判错 —— 因为那一轮 C 其实是 every others、正确答案是 B 的 some other。
     *
     * 数据来源优先级：服务端给的 currentRound（与评分同源）→ 会话项的 options → 当前题库。
     */
    const roundOptions = (t.currentRound && t.currentRound.options) || it.options || q.options || {};
    const pickedText = picked ? roundOptions[picked] || '' : '';
    const answerLetter = (t.currentRound && t.currentRound.answer) || it.answer || q.answer;
    const answerText = answerLetter ? roundOptions[answerLetter] || '' : '';

    // 每次作答的选项顺序可能不同，所以"是不是同一个选择"要比**文字**而不是字母
    const historyHtml = (t.history || []).slice(0, 6).map((h) => `
      <div class="hrow ${h.correct ? 'ok' : ''}">
        <span class="when">${esc(h.day || '')} 第${h.round}轮</span>
        <span class="what">选了 <b class="${h.correct ? 'okc' : 'crit'}">${esc(fmtPicked(h.picked))}</b>${h.pickedText ? ` · ${esc(h.pickedText)}` : ''}</span>
        <span class="mark">${h.correct ? '<span class="okc">对</span>' : '<span class="crit">错</span>'}${h.snapshotMissing ? '<span class="muted" title="那次作答没有留下选项顺序快照，文字是按当前顺序解释的">?</span>' : ''}</span>
      </div>`).join('');

    // 与上一次错选比较：比文字才可靠（字母在不同轮次含义不同）
    const prevWrong = (t.history || []).filter((h) => !h.correct && h.picked);
    const lastWrong = prevWrong[0];
    const sameAsLast = Boolean(lastWrong) && (
      lastWrong.pickedText && pickedText
        ? lastWrong.pickedText === pickedText
        : lastWrong.picked === picked
    );
    const anySnapshotMissing = (t.history || []).some((h) => h.snapshotMissing);

    feedback.innerHTML = `
      <div class="teach" style="margin-top:16px">
        <h4>这道题你已经错 ${t.wrongCount} 次了</h4>
        <div style="margin-bottom:10px">
          你这次选了 <b class="crit">${esc(fmtPicked(picked))}</b>${pickedText ? ` · ${esc(pickedText)}` : ''}，
          正确答案是 <b class="okc">${esc(answerLetter)}</b>${answerText ? ` · ${esc(answerText)}` : ''}
        </div>
        ${q.knowledgePoints.length
          ? `<div style="margin-bottom:10px">考点：${q.knowledgePoints.map((k) => `<span class="chip">${esc(k)}</span>`).join('')}</div>`
          : '<div class="muted" style="margin-bottom:10px">这道题还没标注考点。</div>'}
        ${sameAsLast
          ? `<div class="muted" style="font-size:12.5px;margin-bottom:8px">注意：这次和上次选的是同一个选项（文字相同），说明这个考点还没弄明白。</div>`
          : ''}
        ${anySnapshotMissing
          ? `<div class="warnbox" style="margin-bottom:8px;font-size:12.5px">部分旧记录的选项顺序快照已缺失，带 <b>?</b> 的那几行文字是按<b>当前</b>选项顺序解释的，含义可能与当时不同。</div>`
          : ''}
        ${q.explanation ? `<div style="margin-bottom:10px">${esc(q.explanation)}</div>` : ''}
        <div class="muted" style="font-size:12.5px;margin-bottom:6px">你前几次选的（选项顺序每轮都会打乱，所以文字按当时顺序显示）：</div>
        <div class="history">${historyHtml || '<div class="muted">没有更早的记录</div>'}</div>
        <div class="row" style="margin-top:12px">
          <button class="btn ghost" id="nextQ">懂了，继续下一题</button>
          <button class="btn" id="askHere">就这道题问问</button>
        </div>
        <div id="inlineChat"></div>
      </div>`;

    $('#nextQ').onclick = onNext;
    $('#askHere').onclick = () => {
      // 就地展开对话输入区（不遮挡题目，就在下面）
      const box = $('#inlineChat');
      if ($('#inlineChatInput')) { $('#inlineChatInput').focus(); return; }
      box.innerHTML = `
        <div class="teach" style="margin-top:12px;border-color:#2a4a72;background:#151d29">
          <h4 style="color:var(--accent2)">就这道题提问</h4>
          <div class="muted" style="font-size:12.5px;margin-bottom:8px">
            会自动带上题干、选项、考点和你刚才的作答记录，不用再抄一遍。
          </div>
          <div class="msgs" id="inlineMsgs" style="max-height:260px;padding:0;background:transparent"></div>
          <div class="chatfoot" style="border:0;padding:8px 0 0">
            <textarea id="inlineChatInput" placeholder="例如：为什么不能选我选的那个？这个考点怎么记？"></textarea>
            <button class="btn" id="inlineSend">发送</button>
          </div>
          <div class="row" style="margin-top:8px">
            <button class="btn ghost" id="copyQ" style="font-size:12px">复制内容发给我</button>
          </div>
        </div>`;

      let threadId = null;
      let busy = false;
      const msgs = $('#inlineMsgs');
      const input = $('#inlineChatInput');

      const bubble = (role, text, isError) => {
        const el = document.createElement('div');
        el.className = `msg ${role}${isError ? ' error' : ''}`;
        el.textContent = text;
        msgs.appendChild(el);
        msgs.scrollTop = msgs.scrollHeight;
      };

      const send = async () => {
        const text = input.value.trim();
        if (!text || busy) return;
        busy = true;
        input.value = '';
        bubble('user', text);
        const pendingBubble = document.createElement('div');
        pendingBubble.className = 'msg assistant';
        pendingBubble.textContent = '…';
        msgs.appendChild(pendingBubble);
        msgs.scrollTop = msgs.scrollHeight;

        const r = await INVOKE('chat:ask', { threadId, questionId: q.id, message: text });
        pendingBubble.remove();
        if (r.ok) {
          threadId = r.threadId;
          bubble('assistant', r.reply);
        } else {
          if (r.threadId) threadId = r.threadId;
          bubble('assistant', r.error || '回答失败', true);
          if (r.code === 'NO_MODEL' && r.context) {
            const b = document.createElement('button');
            b.className = 'btn ghost';
            b.style.cssText = 'align-self:flex-start;font-size:12px';
            b.textContent = '复制这道题的内容';
            b.onclick = () => copyText(`${r.context}\n\n我的问题：${text}`);
            msgs.appendChild(b);
          }
        }
        busy = false;
        input.focus();
      };

      $('#inlineSend').onclick = send;
      input.onkeydown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
      };
      $('#copyQ').onclick = () => {
        const lines = [
          '这道英语单选题我反复做错，帮我讲讲：',
          '',
          `题干：${q.stem}`,
          ...Object.entries(q.options).map(([L, v]) => `${L}. ${v}`),
          `正确答案：${q.answer}${q.answerText ? ` · ${q.answerText}` : ''}`,
          q.knowledgePoints.length ? `考点：${q.knowledgePoints.join('、')}` : '',
          prevWrong.length ? `我错选的：${prevWrong.map((h) => fmtPicked(h.picked)).join('、')}` : '',
          `做错次数：${t.wrongCount}`,
        ].filter(Boolean).join('\n');
        copyText(lines);
      };
      input.focus();
    };
  }

  async function renderFinish(partial = false) {
    main.innerHTML = `<div class="practice"><div class="card"><span class="spin"></span> 正在结算…</div></div>`;
    const r = await INVOKE('practice:finish', { sessionId: session.id });
    if (!r.ok) { main.innerHTML = `<div class="crit">${esc(r.error)}</div>`; return; }
    renderResultCard(main, r.summary, r.replay, partial);
  }

  render();
}

/**
 * 渲染结果页。练习结束与"回看历史"共用这一段，保证两处显示完全一致。
 * @param {HTMLElement} main
 * @param {object} s    finishSession 返回的 summary
 * @param {Array}  replay sessionReplay 返回的明细
 * @param {boolean} partial 是否提前结束
 */
function renderResultCard(main, s, replay, partial) {
  const pct = Math.round(s.accuracy * 100);
  const color = pct >= 80 ? 'var(--ok)' : pct >= 60 ? 'var(--warn)' : 'var(--crit)';

  const wrongHtml = (s.wrong || []).map((w, i) => `
    <div class="find crit">
      <b>第 ${i + 1} 题 ${esc(String(w.stem).slice(0, 90))}${String(w.stem).length > 90 ? '…' : ''}</b>
      <div class="pickedline">你选的是 <b class="crit">${esc(fmtPicked(w.picked))}</b>，正确答案是 <b class="okc">${esc(w.answer)}</b></div>
      ${w.explanation ? `<div class="ex">解析：${esc(w.explanation)}</div>` : ''}
      ${(w.knowledgePoints || []).length ? `<div style="margin-top:6px">${w.knowledgePoints.map((k) => `<span class="kp weak">${esc(k)}</span>`).join('')}</div>` : ''}
      ${w.needsTeaching ? `
        <div class="teach" style="margin-top:10px">
          <h4>这道题你已经错 ${w.wrongCount} 次了</h4>
          <div class="muted" style="font-size:12.5px;margin-bottom:8px">

          </div>
          <button class="btn" data-teach="${w.questionId}" style="font-size:12.5px;padding:6px 14px">看我前几次选了什么 + 讲评</button>
        </div>` : `
        <div style="margin-top:8px"><button class="btn ghost" data-teach="${w.questionId}" style="font-size:12px;padding:4px 12px">看讲解</button></div>`}
    </div>`).join('') || '<div class="muted">全对，没有错题。</div>';

  const kpHtml = (s.knowledgePoints || []).length
    ? s.knowledgePoints.map((k) => `<span class="kp weak">${esc(k.name)} ×${k.count}</span>`).join('')
    : '<span class="muted">—</span>';

  const rounds = [...new Set((replay || []).map((x) => x.round))].sort((a, b) => a - b);
  const timelineHtml = rounds.map((rd) => {
    const rows = (replay || []).filter((x) => x.round === rd);
    const right = rows.filter((x) => x.correct).length;
    const answered = rows.filter((x) => x.correct !== null).length;
    return `<div class="muted" style="font-size:12.5px;margin-bottom:6px">第 ${rd} 轮：作答 ${answered} 题，答对 ${right} 题</div>
      <table><tbody>${rows.map((x, i) => `<tr>
        <td>第 ${i + 1} 题</td>
        <td>${esc(String(x.stem).slice(0, 46))}${String(x.stem).length > 46 ? '…' : ''}</td>
        <td>${x.picked ? `选了 <b class="${x.correct ? 'okc' : 'crit'}">${esc(fmtPicked(x.picked))}</b>` : '<span class="muted">未作答</span>'}</td>
        <td>${x.correct === null ? '' : x.correct ? '<span class="okc">对</span>' : `<span class="crit">错，应为 ${esc(x.answer)}</span>`}</td>
      </tr>`).join('')}</tbody></table>`;
  }).join('');

  main.innerHTML = `<div class="practice">
    <div class="card">
      <div class="score">
        <b style="color:${color}">${pct}%</b>
        <div class="lbl">正确率：答对 ${s.correct}/${s.total} 题${partial ? '（本次为提前结束）' : ''}${s.round > 1 ? `，共 ${s.round} 轮` : ''}</div>
      </div>
      <div class="row" style="justify-content:center">
        ${s.needsRetry ? `<button class="btn" id="retryBtn">带我重做错题（${(s.wrong || []).length} 题）</button>` : ''}
        <button class="btn ghost" id="againBtn">返回今日</button>
      </div>
    </div>
    <div class="card"><h2>错题解析</h2>${wrongHtml}</div>
    <div class="card"><h2>本次涉及的知识点</h2>${kpHtml}</div>
    <div class="card"><h2>复习安排</h2>
      <table><tbody>${(s.applied || []).slice(0, 20).map((a) => `<tr>
        <td>第 ${a.questionId} 题</td>
        <td>${a.finalCorrect ? '<span class="okc">最终做对</span>' : '<span class="crit">仍错</span>'}</td>
        <td class="muted">${a.firstTryCorrect === null || a.firstTryCorrect === undefined ? '—' : a.firstTryCorrect ? '一次做对' : `做了 ${a.attempts} 次`}</td>
        <td>${a.intervalDays === null || a.intervalDays === undefined
          ? (a.dueInDays === null || a.dueInDays === undefined ? '<span class="muted">—</span>'
            : a.alreadyDue ? '<span class="warnc">现在待复习</span>'
            : a.dueInDays === 1 ? '下次复习：明天' : `下次复习：${a.dueInDays} 天后`)
          : `下次复习：${a.intervalDays >= 1 ? Math.round(a.intervalDays) + ' 天后' : '很快'}`}</td>
      </tr>`).join('')}</tbody></table>
    </div>
    ${timelineHtml ? `<div class="card"><h2>作答时间线（含错题重做轮）</h2>${timelineHtml}</div>` : ''}
  </div>`;

  const retryBtn = $('#retryBtn');
  if (retryBtn) {
    retryBtn.onclick = async () => {
      const rr = await INVOKE('practice:retry', { sessionId: s.sessionId });
      if (!rr.ok) return toast(rr.error, 'err');
      if (rr.empty) { toast('错题已全部订正'); go('today'); return; }
      go('practice', rr.session, Boolean(rr.resumed));
    };
  }
  $('#againBtn').onclick = () => { location.hash = ''; go('today'); };

  // 讲评入口（错多次的题会显示更醒目的按钮）
  main.querySelectorAll('[data-teach]').forEach((btn) => {
    btn.onclick = () => showTeachDock(Number(btn.dataset.teach), s.sessionId);
  });
}


/* ---------------------------- 录入题目 ---------------------------- *
 * 三条录入路径：

 *   ③ 手动录入：少量题目直接敲

screens.capture = async () => {
  const main = $('#main');

   * 测试钩子：把一批题目直接放进核对页。

   * 用途：自动化验证"核对答案"这条链路（读图 → 核对 → 标出冲突）时，
   * 需要绕开真实的图片上传。没有这个钩子，测试就只能去摸闭包内部细节，
   * 那种测试很脆（实现一改就断）。
   *
   * 注意位置：必须放在 screens.capture **一进来**就执行的地方，
   * 不能放进 renderReview 里 —— 那样会"要用它去触发它自己"，永远调不到。
   */
  window.__setPending = (questions) => {
    // 用 ...q 展开保留全部字段（incomplete / incompleteReason / sourceImage / number 等），

    // 「不完整题提示」这类功能在测试里假阴性（真实识别路径不受影响，但测试不可靠）。
    pending = (questions || []).map((q) => ({
      ...q,
      stem: q.stem || '',
      options: q.options || {},
      answer: q.answer || '',
      explanation: q.explanation || '',
      knowledgePoints: q.knowledgePoints || [],
      difficulty: q.difficulty || 'medium',
      answerInSource: q.answerInSource !== undefined ? q.answerInSource : true,
      groupName: q.groupName || '',
    }));
    saveDraft();
    if (pending.length === 0) {
      $('#reviewArea').innerHTML = '';
      return 0;
    }
    renderReview([]);
    return pending.length;
  };

          选项支持 <code>A. go</code> / <code>A、go</code> / <code>(A) go</code> / <code>A: go</code>，

A. go
B. goes
C. going
D. gone
答案：B

22. The report ____ by the team last week.
A. completes  B. completed  C. was completed  D. has completed
答案：C"></textarea>
        </label>
        <label class="fld"><span>答案表（可选，答案单独列在卷末时用）</span>
          <input type="text" id="answerKey" placeholder="例如 1-5 BCDAB  或  21-B 22-C 23-B" />
        </label>
        <div class="row">
          <label class="fld" style="flex:1;min-width:220px;margin-bottom:0">
            <span>归入分组（可选，按单元归类；填新名字会自动创建）</span>

          </div>
          <label class="row" style="margin-top:10px;gap:8px;color:var(--muted);font-size:12.5px">

          <div id="zipOut" style="margin-top:12px"></div>

        <div class="muted" style="font-size:12.5px;margin-bottom:6px">或者只识别少量图片：</div>
        <div class="drop" id="drop">点击选择图片，或把图片拖到这里 / 直接 Ctrl+V 粘贴截图</div>
        <div class="row" id="thumbs" style="margin-top:12px"></div>
        <label class="row" style="margin-top:12px;gap:8px;color:var(--muted);font-size:13px">
          <input type="checkbox" id="hasAnswer" checked style="width:auto" />
          卷面上印有答案（识别时会尝试找出答案；没有答案请取消勾选，避免模型瞎猜）
        </label>
        <div class="row" style="margin-top:12px">
          <button class="btn" id="ocrBtn" disabled>开始识别</button>
          <span class="muted" id="ocrHint" style="font-size:12.5px">还没有选择图片</span>

      <div id="tab-manual" style="display:none">
        <div class="grid2">

          <div>
            <label class="fld"><span>选项 A</span><input type="text" id="mA" placeholder="go" /></label>
            <label class="fld"><input type="text" id="mB" placeholder="goes" /></label>
            <label class="fld"><input type="text" id="mC" placeholder="going" /></label>
            <label class="fld"><input type="text" id="mD" placeholder="gone" /></label>
          </div>
        </div>
        <div class="row">
          <label class="fld" style="flex:0 0 130px"><span>正确答案</span>
            <select id="mAnswer"><option value="">请选择</option><option>A</option><option>B</option><option>C</option><option>D</option></select>
          </label>
          <label class="fld" style="flex:1;min-width:200px"><span>知识点（用 、或 , 分隔）</span><input type="text" id="mKp" placeholder="一般现在时、主谓一致" /></label>
          <label class="fld" style="flex:0 0 110px"><span>难度</span>
            <select id="mDiff"><option value="easy">简单</option><option value="medium" selected>中等</option><option value="hard">困难</option></select>
          </label>
        </div>
        <label class="fld"><span>解析（可留空）</span><textarea id="mExp" style="min-height:52px"></textarea></label>
        <div class="row">
          <button class="btn" id="mSave">保存这道题</button>
          <button class="btn ghost" id="mAnalyze">让模型判断答案和知识点</button>
        </div>
      </div>
    </div>

    <div id="reviewArea"></div>`;

  // 页签切换
  const showTab = (t) => {
    activeTab = t;
    for (const name of ['text', 'image', 'manual']) {
      $('#tab-' + name).style.display = name === t ? '' : 'none';
    }
    document.querySelectorAll('[data-tab]').forEach((b) => b.classList.toggle('ghost', b.dataset.tab !== t));
  };
  document.querySelectorAll('[data-tab]').forEach((b) => (b.onclick = () => showTab(b.dataset.tab)));

  // 分组下拉候选：让用户能直接选已有分组，也能输入新名字
  (async () => {
    const r = await INVOKE('groups:list');
    if (r.ok) {
      $('#groupOptions').innerHTML = (r.groups || [])
        .map((g) => `<option value="${esc(g.name)}">${g.total} 题</option>`)
        .join('');

  })();

  /* ---------------- ① 文本导入 ---------------- */
  $('#sampleFill').onclick = () => {
    $('#pasteText').value = `Choose the best answer for each blank.

21. He ____ to school by bus every day.

B. goes
C. going
D. gone

22. The report ____ by the team last week.
A. completes  B. completed  C. was completed  D. has completed

23. I have lived here ____ 2010.
A. for
B. since
C. from
D. during

Answers: 21-B  22-C  23-B`;
    $('#answerKey').value = '';
    $('#parseHint').textContent = '已填入示例，点「解析并预览」看效果';
  };

  $('#parseBtn').onclick = async () => {
    const text = $('#pasteText').value;

    if (!r.ok) return toast(r.error, 'err');
    if (r.questions.length === 0) {
      $('#reviewArea').innerHTML = `<div class="card"><div class="crit">没能解析出题目。</div>

    $('#parseHint').textContent = `解析出 ${r.stats.parsed} 题，其中 ${r.stats.withAnswer} 题带答案，${r.stats.needAttention} 题需要你确认`;

  /* ---------------- ② 图片识别（备用） ---------------- */
  const thumbs = $('#thumbs');
  const renderThumbs = () => {

    $('#ocrBtn').disabled = images.length === 0;
    $('#ocrHint').textContent = images.length ? `已选 ${images.length} 张` : '还没有选择图片';
  };

  const addImages = (files) => {
    for (const f of files) if (f.base64) images.push({ name: f.name, base64: f.base64, mime: f.mime || 'image/png' });
    renderThumbs();
  };

  $('#drop').onclick = async () => {
    const files = await pickImages();
    if (files.length) addImages(files);
  };
  document.body.addEventListener('dragover', (e) => e.preventDefault());
  document.body.addEventListener('drop', async (e) => {
    if (current !== 'capture' || activeTab !== 'image') return;
    e.preventDefault();
    addImages(await filesToBase64([...(e.dataTransfer?.files || [])]));
  });
  document.body.addEventListener('paste', async (e) => {
    if (current !== 'capture' || activeTab !== 'image') return;
    const items = [...(e.clipboardData?.items || [])].filter((i) => i.type.startsWith('image/'));
    if (!items.length) return;
    addImages(await filesToBase64(items.map((i) => i.getAsFile()).filter(Boolean)));
  });

  $('#ocrBtn').onclick = async () => {
    $('#ocrBtn').disabled = true;
    const area = $('#reviewArea');
    const all = [];
    const warns = [];
    for (let i = 0; i < images.length; i += 1) {
      area.innerHTML = `<div class="card"><span class="spin"></span> 正在识别第 ${i + 1} / ${images.length} 张…</div>`;
      const r = await INVOKE('capture:extract', {
        imageBase64: images[i].base64,
        mime: images[i].mime,
        answerInSource: $('#hasAnswer').checked,
      });
      if (!r.ok) { warns.push(`第 ${i + 1} 张识别失败：${r.error}`); continue; }

      warns.push(...(r.warnings || []));

      area.innerHTML = `<div class="card"><div class="crit">没有识别出题目。</div>
        <div class="muted" style="margin-top:8px">${warns.map(esc).join('<br>')}</div>
        <div class="muted" style="margin-top:8px">可以改用「文本导入」，或在设置里换一个更强的读图模型。</div></div>`;
      return;
    }

    pendingSource = 'image';
