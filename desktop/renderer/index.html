  /* ---------------- ② 整包识别（ZIP） ---------------- */

  /**
   * 整包识别的队列状态。
   * status: pending（待识别）| running（识别中）| done（成功）| failed（失败）
   */
  let zipBatch = { importId: '', items: [], running: false, paused: false };

  /** 渲染队列进度。每次状态变化都调它，保证界面与状态一致。 */
  function renderZipQueue() {
    // 优先写内层容器（保留上面的解包提示），没有就用 #zipOut
    const out = $('#zipQueue') || $('#zipOut');
    if (!out) return;
    const items = zipBatch.items;
    if (items.length === 0) {
      out.innerHTML = '';
      $('#zipStartBtn').disabled = true;
      $('#zipClearBtn').style.display = 'none';
      $('#zipPauseBtn').style.display = 'none';
      return;
    }
    const done = items.filter((i) => i.status === 'done').length;
    const failed = items.filter((i) => i.status === 'failed').length;
    const remaining = items.filter((i) => i.status === 'pending').length;
    const totalQ = items.reduce((a, b) => a + (b.questions || 0), 0);
    const pct = Math.round((done / items.length) * 100);

    const failedList = items.filter((i) => i.status === 'failed');
    /**
     * "可疑"的图：数量对不上，或出现不完整的题。
     * 这正是用户报告的 bug —— 13 题的卷子录成 15 题、还夹一道残缺的。
     * 把这些挑出来单独给一个"用原图重识别"的出口。
     */
    const suspect = items.filter(
      (i) => i.status === 'done' && (i.countMismatch || i.incompleteCount > 0),
    );

    out.innerHTML = `
      <div class="row" style="justify-content:space-between;margin-bottom:6px">
        <span><b>${done}</b> / ${items.length} 张已识别${
          failed ? `｜<b class="crit">${failed} 张失败</b>` : ''
        }${remaining ? `｜${remaining} 张待识别` : ''}｜累计 <b>${totalQ}</b> 道题</span>
        <span class="muted" style="font-size:12.5px">${zipBatch.paused ? '已暂停' : zipBatch.running ? '识别中…' : '就绪'}</span>
      </div>
      <div class="bar" style="margin-bottom:10px"><i style="width:${pct}%"></i></div>
      <div style="max-height:220px;overflow:auto">
        <table style="width:100%;font-size:12.5px">
          <tbody>${items
            .map((it) => {
              const mark =
                it.status === 'done'
                  ? (it.countMismatch || it.incompleteCount
                      ? `<span class="crit">⚠ ${it.questions} 题</span>`
                      : `<span class="okc">✓ ${it.questions} 题</span>`)
                  : it.status === 'running'
                    ? `<span class="spin"></span> ${it.stage === 'compressing' ? '压缩中' : it.stage === 'recognizing' ? '识别中' : '处理中'}`
                    : it.status === 'failed'
                      ? `<span class="crit">✗ ${esc(it.error || '失败')}</span>`
                      : '<span class="muted">待识别</span>';
              // 数量核对：把"模型说几道 / 实际抄出几条"直接摆出来，
              // 这样"本应 13 题却录成 15 题"这类问题当场就能看见
              let problem = '';
              if (it.status === 'done') {
                if (it.countMismatch) {
                  problem = `<span class="crit">数量不符：说 ${it.claimedTotal} 道，抄出 ${it.actualTotal} 条</span>`;
                }
                if (it.incompleteCount) {
                  problem += `${problem ? '<br>' : ''}<span class="crit">${it.incompleteCount} 道不完整</span>`;
                }
                if (!problem && it.warnings && it.warnings.length) {
                  problem = `<span class="muted">${esc(String(it.warnings[0]).slice(0, 40))}</span>`;
                }
              }
              // 体积信息：让用户看到压缩到底省了多少
              const sizeInfo =
                it.originalBytes && it.bytes && it.bytes < it.originalBytes
                  ? `<span class="muted">${fmtBytes(it.originalBytes)} → ${fmtBytes(it.bytes)}</span>`
                  : it.size
                    ? `<span class="muted">${fmtBytes(it.size)}</span>`
                    : '';
              return `<tr>
                <td style="color:var(--muted);white-space:nowrap">#${it.index}</td>
                <td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
                  <a href="#" class="zipsrc" data-view="${it.index}" title="点击查看图片">${esc(it.name)}</a>
                </td>
                <td style="white-space:nowrap">${sizeInfo}</td>
                <td style="white-space:nowrap">${mark}</td>
                <td style="font-size:12px">${problem}</td>
              </tr>`;
            })
            .join('')}</tbody>
        </table>
      </div>
      ${
        items.some((i) => i.savedBytes)
          ? `<div class="muted" style="margin-top:8px;font-size:12px">
              压缩共省下 ${fmtBytes(items.reduce((a, b) => a + (b.savedBytes || 0), 0))}（识别准确率基本不受影响）
            </div>`
          : ''
      }
      ${
        suspect.length
          ? `<div class="warnbox" style="margin-top:10px">
              <b>有 ${suspect.length} 张图的识别结果可疑</b>
              <div class="muted" style="margin-top:6px;font-size:12.5px">
                数量对不上或出现不完整题，通常有两种原因：<br>
                ① 图片被压缩后笔画糊了 → 点下面的按钮「用原图重识别」（慢一些但更准）<br>
                ② 卷面本身模糊或被裁掉 → 建议重拍那一页
              </div>
              <div class="row" style="margin-top:8px">
                <button class="btn ghost" id="zipRedoRaw">用原图重识别这 ${suspect.length} 张</button>
              </div>
            </div>`
          : ''
      }
      ${
        failedList.length
          ? `<div class="row" style="margin-top:10px">
              <button class="btn ghost" id="zipRetryFailed">重试失败的 ${failedList.length} 张</button>
            </div>`
          : ''
      }`;

    $('#zipStartBtn').disabled = zipBatch.running || items.every((i) => i.status === 'done');
    $('#zipStartBtn').textContent = zipBatch.paused
      ? '继续识别'
      : remaining === 0
        ? '全部已完成'
        : `开始逐张识别（共 ${items.length} 张）`;
    $('#zipClearBtn').style.display = zipBatch.running ? 'none' : '';
    $('#zipPauseBtn').style.display = zipBatch.running ? '' : 'none';

    if ($('#zipRetryFailed')) {
      $('#zipRetryFailed').onclick = () => {
        for (const it of zipBatch.items) if (it.status === 'failed') it.status = 'pending';
        runZipQueue();
      };
    }

    // 点文件名打开图片查看器（核对题目时对照原图）。
    // data-view 是队列里显示的序号（1 基的 index），与 items 顺序一致，
    // 所以直接用它定位；失败/待识别的图也要能看。
    out.querySelectorAll('.zipsrc').forEach((a) => {
      a.onclick = (e) => {
        e.preventDefault();
        const wanted = Number(a.dataset.view);
        const pos = zipBatch.items.findIndex((x) => x.index === wanted);
        openViewerAt(pos >= 0 ? pos : 0);
      };
    });

    if ($('#zipRedoRaw')) {
      $('#zipRedoRaw').onclick = async () => {
        // 1) 让服务端把这几张换回未压缩的原图
        const list = items.filter((i) => i.status === 'done' && (i.countMismatch || i.incompleteCount > 0));
        for (const it of list) {
          const r = await INVOKE('capture:zipRestoreOriginal', { itemId: it.itemId });
          if (r.ok) {
            viewerInvalidateItem(it.itemId);
            it.noCompress = true; // 这一轮跳过压缩
            it.status = 'pending';
            it.savedBytes = 0;
            it.countMismatch = false;
            it.incompleteCount = 0;
          } else {
            // 没有原图（本来就没压过）时，至少要重跑一次识别
            it.status = 'pending';
          }
        }
        toast(`将用原图重新识别 ${list.length} 张`, 'okc');
        runZipQueue();
      };
    }
  }

  /** 逐张顺序识别。可暂停：暂停后当前这张跑完就停。 */
  async function runZipQueue() {
    if (zipBatch.running) return;
    zipBatch.running = true;
    zipBatch.paused = false;
    renderZipQueue();

    for (;;) {
      if (zipBatch.paused) break;
      const it = zipBatch.items.find((x) => x.status === 'pending');
      if (!it) break;

      it.status = 'running';
      renderZipQueue();

      try {
        // 逐张从服务端取（不把整包一次性塞进页面）
        const got = await INVOKE('capture:zipItem', { itemId: it.itemId });
        if (!got.ok) {
          it.status = 'failed';
          it.error = got.error || '取图失败';
          renderZipQueue();
          continue;
        }

        // 上传前瘦身：手机原图常有 3-5MB，读图模型内部也就用约 1024 token，
        // 缩到长边 1600 再转 JPEG 几乎不损识别率，却大幅减少传输与耗时。
        // 用 it.noCompress 标记的图跳过（用户选了"用原图重试"）。
        it.stage = 'compressing';
        renderZipQueue();
        let imageBase64 = got.imageBase64;
        let mime = got.mime || it.mime;
        if ($('#zipCompress').checked && !it.noCompress) {
          const c = await compressImageDataUrl(`data:${mime};base64,${got.imageBase64}`);
          if (c.compressed) {
            imageBase64 = c.dataUrl.split(',')[1] || imageBase64;
            mime = 'image/jpeg';
            it.savedBytes = (it.savedBytes || 0) + (c.originalBytes - c.bytes);
            // 回存到服务端：这样"用原图重试"时服务端还留着未压缩的版本
            try {
              await INVOKE('capture:zipSaveCompressed', {
                itemId: it.itemId,
                imageBase64,
                mime,
              });
              viewerInvalidateItem(it.itemId);
            } catch (e) { /* 回存失败不影响本次识别 */ }
          }
          it.note = c.reason;
          it.originalBytes = c.originalBytes;
          it.bytes = c.bytes;
        }
        it.noCompress = false;

        it.stage = 'recognizing';
        renderZipQueue();
        const r = await INVOKE('capture:extract', {
          imageBase64,
          mime,
          answerInSource: $('#hasAnswer').checked,
          sourceName: it.name,
        });
        if (!r.ok) {
          // 跳过继续：记下原因，后面可以单独重试
          it.status = 'failed';
          it.error = r.error || '识别失败';
        } else {
          it.status = 'done';
          it.questions = (r.questions || []).length;
          it.data = r.questions || [];
          it.warnings = r.warnings || [];
          // 数量核对结果：模型说图里有几道 vs 实际抄出几条
          it.claimedTotal = r.claimedTotal;
          it.actualTotal = r.actualTotal;
          it.countMismatch = Boolean(r.countMismatch);
          it.incompleteCount = r.incompleteCount || 0;
        }
      } catch (e) {
        it.status = 'failed';
        it.error = e.message || '识别异常';
      }
      it.stage = '';
      renderZipQueue();
    }

    zipBatch.running = false;
    renderZipQueue();

    const total = zipBatch.items.reduce((a, b) => a + (b.questions || 0), 0);
    const failed = zipBatch.items.filter((i) => i.status === 'failed').length;
    const done = zipBatch.items.filter((i) => i.status === 'done').length;

    if (zipBatch.paused) {
      toast(`已暂停：完成 ${done} 张，累计 ${total} 道题`, 'okc');
      return;
    }
    if (total === 0) {
      toast(failed ? `全部失败（${failed} 张），请检查模型配置` : '没有识别出题目', 'err');
      return;
    }
    // 汇总进核对页（与单张识别走同一条路）
    collectZipResults();
  }

  /** 把整包识别的结果汇总，送进核对页。 */
  function collectZipResults() {
    const all = [];
    const warns = [];
    for (const it of zipBatch.items) {
      if (it.status === 'done' && it.data) all.push(...it.data);
      if (it.status === 'failed') warns.push(`「${it.name}」识别失败：${it.error}`);
      for (const w of it.warnings || []) warns.push(`「${it.name}」：${w}`);
    }
    if (all.length === 0) {
      const out = $('#zipOut');
      out.innerHTML += `<div class="warnbox" style="margin-top:10px">没有识别出任何题目。可以逐张重试，或换一个更强的读图模型。</div>`;
      return;
    }
    const inc = countIncomplete(all);
    pending = all;
    pendingSource = 'image';
    saveDraft();
    if (inc > 0) {
      warns.push(`有 ${inc} 道题选项可能不完整（被页面边缘裁掉），请核对补充。`);
    }
    toast(
      `整包识别完成：${all.length} 道题，请核对` +
        (inc > 0 ? `（其中 ${inc} 道选项可能不完整）` : ''),
      'okc',
    );
    renderReview(warns);
    // 滚到核对区，省得用户找不到
    $('#reviewArea')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  $('#zipFile').onchange = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const out = $('#zipOut');
    const mb = (file.size / 1048576).toFixed(1);

    // 大小预检：超限就当场说清楚，不白等一次上传再被拒
    if (file.size > ZIP_UPLOAD_LIMIT) {
      out.innerHTML = `<div class="warnbox">
        <b>这个压缩包 ${mb} MB，超过了 ${(ZIP_UPLOAD_LIMIT / 1048576).toFixed(0)} MB 的上限。</b>
        <div class="muted" style="margin-top:8px">
          两个办法：<br>
          ① 分成几个小包，分几次导入（推荐，最省事）<br>
          ② 先把里面的试卷照片压缩一遍再打包 —— 手机原图常有 3-5MB，
             压到 1MB 对识别准确率几乎没有影响
        </div>
      </div>`;
      $('#zipFile').value = '';
      return;
    }

    out.innerHTML = `<div class="hintbox"><span class="spin"></span> 正在读取文件 ${esc(file.name)}（${mb} MB）…</div>`;

    // 先释放上一批，避免内存叠加
    await INVOKE('capture:zipClear', {});

    // 读成 ArrayBuffer：**不做 base64 转换**
    // （base64 会让体积涨 33%，65MB 的包会变成 87MB，既慢又容易撞上限）
    const buf = await new Promise((resolve) => {
      const fr = new FileReader();
      fr.onload = () => resolve(fr.result);
      fr.onerror = () => resolve(null);
      fr.readAsArrayBuffer(file);
    }).catch(() => null);
    if (!buf) {
      out.innerHTML = `<div class="warnbox">读取文件失败，请重新选择</div>`;
      return;
    }

    out.innerHTML = `<div class="hintbox"><span class="spin"></span> 正在解压 ${esc(file.name)}（${mb} MB）…</div>`;

    // 走二进制上传通道：原样传字节
    let r;
    try {
      r = await UPLOAD('capture:unzipBinary', buf);
    } catch (err) {
      out.innerHTML = `<div class="warnbox"><b>上传失败：</b>${esc(err.message)}</div>`;
      return;
    }
    if (!r.ok) {
      out.innerHTML = `<div class="warnbox"><b>解包失败：</b>${esc(r.error)}</div>`;
      zipBatch = { importId: '', items: [], running: false, paused: false };
      renderZipQueue();
      return;
    }
    zipBatch = {
      importId: r.importId,
      items: r.items.map((it) => ({ ...it, status: 'pending', questions: 0 })),
      running: false,
      paused: false,
    };
    const totalMB = (r.totalBytes / 1048576).toFixed(1);
    const skippedNote =
      r.errors && r.errors.length
        ? `<div class="muted" style="margin-top:6px;font-size:12px">跳过的文件：${r.errors
            .slice(0, 5)
            .map(esc)
            .join('；')}${r.errors.length > 5 ? ` …等 ${r.errors.length} 个` : ''}</div>`
        : '';
    // 队列渲染在同一条提示下面：先写提示，再由 renderZipQueue 追加进度表
    out.innerHTML = `<div class="hintbox">
      ${esc(r.message)}，解压后合计 ${totalMB} MB。点「开始逐张识别」逐张处理。
      ${skippedNote}
    </div><div id="zipQueue"></div>`;
    renderZipQueue();
    toast(r.message, 'okc');
  };

  $('#zipStartBtn').onclick = () => {
    zipBatch.paused = false;
    runZipQueue();
  };
  $('#zipPauseBtn').onclick = () => {
    zipBatch.paused = true;
    $('#zipPauseBtn').disabled = true;
    setTimeout(() => { $('#zipPauseBtn').disabled = false; }, 800);
    toast('已请求暂停：当前这张识别完就停', 'okc');
  };
  $('#zipClearBtn').onclick = async () => {
    if (zipBatch.running) return;
    await INVOKE('capture:zipClear', {});
    zipBatch = { importId: '', items: [], running: false, paused: false };
    $('#zipFile').value = '';
    const out = $('#zipOut');
    if (out) out.innerHTML = '';
    renderZipQueue();
    toast('已清空这批', 'okc');
  };

  /* ---------------- ③ 手动录入 ---------------- */
  const manualQuestion = () => {
    const options = {};
    for (const L of ['A', 'B', 'C', 'D']) {
      const v = $(`#m${L}`).value.trim();
      if (v) options[L] = v.replace(new RegExp(`^${L}\\s*[.、)．]\\s*`, 'i'), '');
    }
    return {
      stem: $('#mStem').value.trim(),
      options,
      answer: $('#mAnswer').value,
      explanation: $('#mExp').value.trim(),
      knowledgePoints: $('#mKp').value.split(/[,，、;；]/).map((s) => s.trim()).filter(Boolean),
      difficulty: $('#mDiff').value,
    };
  };

  $('#mSave').onclick = async () => {
    const q = manualQuestion();
    const r = await INVOKE('questions:save', { questions: [q], onDuplicate: 'skip' });
    if (!r.ok) return toast(r.error, 'err');
    const one = r.results[0];
    if (!one.ok) return toast('保存失败：' + one.errors.join('；'), 'err');
    if (one.action === 'duplicate' || one.action === 'skipped') return toast('这道题已存在，已跳过', 'err');
    toast('已保存，进入每日练习队列', 'okc');
    ['mStem', 'mA', 'mB', 'mC', 'mD', 'mExp', 'mKp'].forEach((id) => ($(`#${id}`).value = ''));
    $('#mAnswer').value = '';
  };

  $('#mAnalyze').onclick = async () => {
    const q = manualQuestion();
    if (!q.stem || Object.keys(q.options).length < 2) return toast('先填题干和至少两个选项', 'err');
    toast('正在让模型判断答案…');
    const r = await INVOKE('capture:analyze', { question: q });
    if (!r.ok) return toast(r.error || '分析失败', 'err');
    if (r.answer) $('#mAnswer').value = r.answer;
    if (r.explanation) $('#mExp').value = r.explanation;
    if (r.knowledgePoints?.length) $('#mKp').value = r.knowledgePoints.join('、');
    if (r.difficulty) $('#mDiff').value = r.difficulty;
    toast(`模型判断答案：${r.answer || '不确定（请自己选）'}`, 'okc');
  };

  /* ---------------- 核对与入库（三条路径共用） ---------------- */
  function renderReview(warns, keepVerify = false) {
    // 换了批次就清掉上一轮的核对结果，否则标记会串到新题上（下标含义已变）
    if (!keepVerify) verifyMap = {};
    const needFix = pending.filter((q) => !q.stem || Object.keys(q.options || {}).length < 2 || !q.answer).length;
    const incCount = countIncomplete(pending);
    const groupName = ($('#importGroup')?.value || '').trim();
    $('#reviewArea').innerHTML = `
      <div class="card">
        <h2>核对修改（共 ${pending.length} 道${needFix ? `，其中 ${needFix} 道必须补全后才能入库` : ''}）</h2>
        <div class="row" style="margin-bottom:12px">
          <label class="fld" style="flex:1;min-width:240px;margin-bottom:0">
            <span>这一批归入的分组（改这里会应用到全部 ${pending.length} 道）</span>
            <input type="text" id="batchGroup" list="groupOptions" value="${esc(groupName)}" placeholder="不填则不分组" />
          </label>
        </div>
        ${warns && warns.length ? `<div class="warnbox">解析时有 ${warns.length} 处要你确认：<ul>${warns.slice(0, 12).map((w) => `<li>${esc(w)}</li>`).join('')}</ul></div>` : ''}
        ${incCount > 0 ? `
          <div class="warnbox" style="margin-bottom:10px">
            <b>有 ${incCount} 道题选项可能不完整</b>
            <span class="muted">（可能被页面边缘裁掉，请核对补充）</span>
          </div>` : ''}
        <div class="hintbox" style="margin-bottom:10px">
          <b>答案不一定对。</b>读图会认错字母（B 认成 8）、答案栏可能串行，模型自己判断也可能错。
          点「核对答案」会让模型<b>不带图片、不看原答案</b>把每道题独立重做一遍，
          与识别出的答案比对；两边<b>不一致</b>的题会标红，请对照原卷确认。不会替你改答案。
        </div>
        <div id="verifyOut"></div>
        <div class="row" style="justify-content:space-between;margin-bottom:8px">
          <span class="row" style="gap:10px">
            <label class="row" style="gap:6px;color:var(--muted);font-size:12.5px">
              <input type="checkbox" id="pickAll" style="width:auto" /> 全选
            </label>
            <span class="muted" id="pickInfo" style="font-size:12.5px">未选中</span>
          </span>
          <span class="row" style="gap:8px">
            <button class="btn ghost" id="verifyBtn">核对答案</button>
            <button class="btn danger" id="delPicked" disabled>删除选中的题</button>
            <button class="btn danger" id="clearAll">全部清空</button>
          </span>
        </div>
        <div class="qlist" id="qlist"></div>
        <div class="row" style="margin-top:14px">
          <button class="btn" id="saveAll">全部入库（${pending.length} 道）</button>
          <button class="btn ghost" id="dropAll">放弃本次</button>
        </div>
      </div>`;

    // 注意顺序：先定义"选中状态"的读写与按钮，再渲染列表。
    // renderQList 内部会用到 window.__updatePick，顺序颠倒会导致勾选后按钮不响应。
    const pickedIdx = () => [...document.querySelectorAll('.qpick:checked')].map((c) => Number(c.dataset.i));
    const updatePick = () => {
      const n = pickedIdx().length;
      const info = $('#pickInfo');
      if (info) info.textContent = n ? `已选中 ${n} 道` : '未选中';
      const del = $('#delPicked');
      if (del) del.disabled = n === 0;
      const all = $('#pickAll');
      if (all) all.checked = n > 0 && n === pending.length;
    };
    window.__updatePick = updatePick;

    $('#pickAll').onchange = (e) => {
      document.querySelectorAll('.qpick').forEach((c) => { c.checked = e.target.checked; });
      updatePick();
    };
    $('#delPicked').onclick = () => {
      collect(); // 先保存用户已做的修改，避免删除时丢失其它题的编辑
      const idxs = pickedIdx().sort((a, b) => b - a); // 从后往前删，避免索引错位
      if (!idxs.length) return;
      for (const i of idxs) pending.splice(i, 1);
      saveDraft();
      if (pending.length === 0) {
        $('#reviewArea').innerHTML = '<div class="card"><div class="muted">已删除全部待入库的题目。可以重新粘贴或放弃。</div></div>';
        return;
      }
      toast(`已删除 ${idxs.length} 道`, 'okc');
      renderReview([]);
    };
    $('#clearAll').onclick = () => {
      if (!confirm(`确定清空全部 ${pending.length} 道待入库的题？\n\n（这些题还没入库，清空后需要重新粘贴）`)) return;
      pending = [];
      saveDraft();
      $('#reviewArea').innerHTML = '<div class="card"><div class="muted">已清空待入库的题目。</div></div>';
    };

    renderQList();

    /**
     * 核对答案：让模型独立重做一遍，与识别出的答案比对。
     *
     * 关键点：
     *  1. 先把界面上的编辑 collect() 回去 —— 用户可能已经改过题干，要用改后的题去核对
     *  2. 核对**只提示、不改答案**。冲突时由用户对照原卷决定，因为两条路径都可能错：
     *     识别的可能对（模型做题会错），独立的也可能对（印在卷面上的答案也常被认错）
     *  3. 核对完只重绘标记，不重建整个列表（避免丢掉用户正在编辑的内容）
     */
    $('#verifyBtn').onclick = async () => {
      collect();
      const usable = pending.filter((q) => q.stem && Object.keys(q.options || {}).length >= 2);
      if (usable.length === 0) return toast('没有可核对的题目（需要题干和至少 2 个选项）', 'err');

      const btn = $('#verifyBtn');
      btn.disabled = true;
      const out = $('#verifyOut');
      out.innerHTML = `<div class="hintbox"><span class="spin"></span> 正在让模型独立重做这 ${usable.length} 道题…（每题一次请求，稍等）</div>`;

      // 只把有题干/选项的题送出去；用下标映射回来，保证标记落在正确的题上
      const idxMap = [];
      const payload = [];
      pending.forEach((q, i) => {
        if (q.stem && Object.keys(q.options || {}).length >= 2) {
          idxMap.push(i);
          payload.push({ stem: q.stem, options: q.options, answer: q.answer });
        }
      });

      const r = await INVOKE('capture:verifyAnswers', { questions: payload });
      btn.disabled = false;

      if (!r.ok) {
        out.innerHTML = '';
        return toast(r.error || '核对失败', 'err');
      }
      if (r.error) {
        out.innerHTML = `<div class="warnbox">${esc(r.error)}。可以先在设置页配置模型，或自己逐题确认答案。</div>`;
        return;
      }

      verifyMap = {};
      let filledCount = 0;
      for (const item of r.items || []) {
        const realIdx = idxMap[item.index];
        if (realIdx === undefined) continue;
        verifyMap[realIdx] = item;
        // 自动补全解析：只补"无用解析"（空，或「卷面未标注答案 / 无法确定 / 看不清」这类占位），
        // 绝不覆盖用户自己写好的解析；也绝不动 answer —— 冲突仍由用户对照原卷决定。
        if (item.reason) {
          const q = pending[realIdx];
          const cur = String(q.explanation || '').trim();
          if (!cur || /卷面未标注答案|无法确定|看不清/.test(cur)) {
            pending[realIdx].explanation = item.reason;
            filledCount += 1;
          }
        }
      }

      const conflicts = r.conflicts || 0;
      out.innerHTML = `<div class="${conflicts ? 'warnbox' : 'hintbox'}">
        核对完成：<b>${r.checked}</b> 道题已独立重做｜
        <span class="okc">一致 ${r.agreed}</span>｜
        ${conflicts ? `<b class="crit">不一致 ${conflicts}（请对照原卷确认）</b>` : '不一致 0'}｜
        无法判断 ${r.unknown}
        ${conflicts ? '<div style="margin-top:4px">下面标红的题就是答案可能被认错的，请重点看这几道。</div>' : ''}
        ${filledCount ? `<div style="margin-top:4px"><span class="okc">已自动补全 ${filledCount} 道题的解析</span></div>` : ''}
      </div>`;
      // 只重绘标记：重新渲染题目列表（内容来自 pending，用户编辑已 collect 过）
      renderQList();
      $('#pickAll').checked = false;
      if (window.__updatePick) window.__updatePick();
      toast(conflicts ? `有 ${conflicts} 道题答案需要确认` : '核对完成，未发现矛盾', conflicts ? 'err' : 'okc');
    };

    // 批量改分组：立刻反映到每道题上，避免"改了没生效"
    $('#batchGroup').oninput = (e) => {
      const v = e.target.value.trim();
      for (const q of pending) q.groupName = v;
      // 同步每道题那一行的小输入框
      $('#qlist')?.querySelectorAll('[data-f=group]').forEach((el) => (el.value = v));
      const gn = $('#importGroup');
      if (gn) gn.value = v;
    };

    $('#saveAll').onclick = async () => {
      collect();
      const bad = pending.filter((q) => !q.answer || !q.stem || Object.keys(q.options || {}).length < 2);
      if (bad.length) return toast(`还有 ${bad.length} 道题缺题干/选项/答案，补全后再入库`, 'err');
      const r = await INVOKE('import:commit', { questions: pending, onDuplicate: 'skip' });
      if (!r.ok) return toast(r.error, 'err');
      const groups = [...new Set(pending.map((q) => q.groupName).filter(Boolean))];
      const msg = `已入库 ${r.created} 道${r.skipped ? `，跳过重复 ${r.skipped} 道` : ''}${r.failed ? `，失败 ${r.failed} 道` : ''}`
        + (groups.length ? `，归入「${groups.join('、')}」` : '');
      toast(msg, r.failed ? 'err' : 'okc');
      pending = []; images = []; renderThumbs();
      clearDraft(); // 入库成功后清除草稿，避免下次误恢复已入库的题
      $('#reviewArea').innerHTML = `<div class="card"><div class="okc">${esc(msg)}</div>
        <div class="row" style="margin-top:12px">
          <button class="btn" id="goPractice">去今日练习</button>
          <button class="btn ghost" id="goGroups">看各单元情况</button>
        </div></div>`;
      $('#goPractice').onclick = () => go('today');
      $('#goGroups').onclick = () => go('groups');
    };
    $('#dropAll').onclick = () => { pending = []; saveDraft(); $('#reviewArea').innerHTML = ''; };
  }

  /**
   * 核对结果（抗干扰）。键是题在 pending 里的下标。
   * 由「核对答案」按钮填充，renderQList 读取它来显示标记。
   */
  let verifyMap = {};

  /** 生成一道题的核对标记。冲突必须显眼，因为那是唯一需要人介入的情况。 */
  function verifyBadge(i) {
    const v = verifyMap[i];
    if (!v) return '';
    if (v.status === 'conflict') {
      return `<div class="warnbox" style="margin-bottom:8px;border-color:#f0603c">
        <b class="crit">⚠ 答案可能不对</b>：${esc(v.message)}
        ${v.reason ? `<div class="muted" style="font-size:12px;margin-top:3px">模型独立作答的依据：${esc(v.reason)}</div>` : ''}
        <div style="margin-top:4px">${esc(v.suggestion)}</div>
      </div>`;
    }
    if (v.status === 'agree') {
      return `<div class="muted" style="margin-bottom:8px;font-size:12.5px"><span class="okc">✓ 已核对</span>：${esc(v.message)}</div>`;
    }
    return `<div class="muted" style="margin-bottom:8px;font-size:12.5px">核对未果：${esc(v.message)}。${esc(v.suggestion || '')}</div>`;
  }

  function renderQList() {
    const view = reviewOrder();
    const problemCount = view.filter((v) => v.score > 0).length;

    // 有问题时先给一条说明，告诉用户"为什么顺序看起来是乱的"
    const banner =
      problemCount > 0
        ? `<div class="warnbox" style="margin-bottom:10px">
            已把 <b>${problemCount} 道需要处理的题排在前面</b>（其余按原顺序跟在后面）。
            每题都标了它来自哪张图，方便你对照原图修改。<br>
            <span class="muted">下面的「第 N 题」是它在本批里的<b>原始编号</b>，
            所以排到前面时编号看起来会跳号 —— 这是故意的，方便你在原卷上找到对应那道题。</span>
           </div>`
        : '';

    $('#qlist').innerHTML = banner + view
      .map(({ q, i, score }) => {
        // 题号用"原始顺序号"，即使被排到前面也还是原来那题的编号，
        // 便于用户在原卷上找到对应的题
        const badges = [];
        if (!(q.stem || '').trim()) badges.push(['必须补题干', 'crit']);
        if (Object.keys(q.options || {}).length < 2) badges.push(['选项不足', 'crit']);
        if (!q.answer) badges.push(['缺答案', 'crit']);
        if (q.incomplete) {
          badges.push([`不完整${q.incompleteReason ? `：${q.incompleteReason}` : ''}`, 'crit']);
        }
        if (q.issues && q.issues.length) badges.push([q.issues[0], 'crit']);
        if (q.confidence !== null && q.confidence !== undefined && q.confidence < 0.7) {
          badges.push([`信心 ${(q.confidence * 100).toFixed(0)}%`, 'muted']);
        }
        const badgeHtml = badges.length
          ? `<div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:6px">${badges
              .map(([t, k]) => `<span class="${k === 'crit' ? 'crit' : 'muted'}" style="font-size:12px;border:1px solid currentColor;border-radius:4px;padding:1px 6px">${esc(t)}</span>`)
              .join('')}</div>`
          : '';

        const src = shortSource(q.sourceImage);
        const srcHtml = src
          ? `<div class="muted" style="font-size:12px;margin-bottom:6px" title="${esc(q.sourceImage)}">来自：<b>${esc(src)}</b></div>`
          : '';

        return `
      <div class="qitem" data-i="${i}" style="${score > 0 ? 'border-left:3px solid var(--crit)' : ''}">
        <div class="row" style="justify-content:space-between;margin-bottom:8px">
          <span class="row" style="gap:8px">
            <input type="checkbox" class="qpick" data-i="${i}" style="width:auto" title="勾选后可批量删除" />
            <b>第 ${i + 1} 题${q.number ? `（原题号 ${q.number}）` : ''}</b>
            ${score > 0 ? '<span class="crit" style="font-size:12px">需处理</span>' : ''}
            ${verifyMap[i] && verifyMap[i].status === 'conflict' ? '<span class="crit" style="font-size:12px">答案待确认</span>' : ''}
          </span>
          <span class="row" style="gap:6px">
            ${q.confidence !== null && q.confidence !== undefined ? `<span class="muted" style="font-size:12px">识别信心 ${(q.confidence * 100).toFixed(0)}%</span>` : ''}
            <button class="btn danger" data-del="${i}" style="padding:3px 9px;font-size:12px">删除这道</button>
          </span>
        </div>
        ${srcHtml}
        ${badgeHtml}
        ${verifyBadge(i)}
        <label class="fld"><span>题干</span><textarea data-f="stem">${esc(q.stem)}</textarea></label>
        <div class="grid2">
          ${['A', 'B', 'C', 'D'].map((L) => `
            <label class="fld" style="margin-bottom:8px"><span>选项 ${L}</span>
              <input type="text" data-f="opt${L}" value="${esc(q.options?.[L] || '')}" /></label>`).join('')}
        </div>
        <div class="row">
          <label class="fld" style="flex:0 0 120px"><span>正确答案</span>
            <select data-f="answer">
              <option value="">请选择</option>
              ${['A', 'B', 'C', 'D', 'E', 'F'].map((L) => `<option value="${L}" ${q.answer === L ? 'selected' : ''}>${L}</option>`).join('')}
            </select></label>
          <label class="fld" style="flex:1;min-width:180px"><span>知识点（用 、 分隔）</span>
            <input type="text" data-f="kp" value="${esc((q.knowledgePoints || []).join('、'))}" /></label>
          <label class="fld" style="flex:0 0 110px"><span>难度</span>
            <select data-f="difficulty">
              ${['easy', 'medium', 'hard'].map((d) => `<option value="${d}" ${q.difficulty === d ? 'selected' : ''}>${{ easy: '简单', medium: '中等', hard: '困难' }[d]}</option>`).join('')}
            </select></label>
        </div>
        <label class="fld" style="margin-bottom:0"><span>解析</span><textarea data-f="explanation" style="min-height:46px">${esc(q.explanation || '')}</textarea></label>
        <label class="fld" style="margin:8px 0 0"><span>分组（可单题调整）</span>
          <input type="text" data-f="group" list="groupOptions" value="${esc(q.groupName || '')}" placeholder="不填则不分组" /></label>
        <label class="fld" style="margin:8px 0 0"><span>出处（可改，方便以后回查）</span>
          <input type="text" data-f="sourceNote" value="${esc(q.sourceNote || '')}" placeholder="例如 第一单元 试卷3 第7题" /></label>
      </div>`;
      })
      .join('');

    $('#qlist').querySelectorAll('[data-del]').forEach((b) => {
      b.onclick = () => {
        collect();
        pending.splice(Number(b.dataset.del), 1);
        saveDraft();
        if (pending.length === 0) {
          $('#reviewArea').innerHTML = '<div class="card"><div class="muted">待入库的题目已全部删除。</div></div>';
          return;
        }
        renderReview([]);
      };
    });
    // 勾选状态变化时更新"已选中 N 道"与批量删除按钮
    $('#qlist').querySelectorAll('.qpick').forEach((c) => {
      c.onchange = () => { if (window.__updatePick) window.__updatePick(); };
    });
    if (window.__updatePick) window.__updatePick();
  }

  /**
   * 一道题的"问题严重度"，越大越该先看。0 表示没问题。
   *
   * 为什么要排序：整包识别几十张图后，有问题的题散落在几百道题里，
   * 用户翻找起来很痛苦。把需要处理的排到最前面，核对才有效率。
   */
  function problemScore(q, i) {
    let s = 0;
    const okStem = Boolean((q.stem || '').trim());
    const optCount = Object.keys(q.options || {}).length;
    // 缺题干/选项不足/没答案 —— 不补全就无法入库，最优先
    if (!okStem || optCount < 2 || !q.answer) return 3;
    if (q.incomplete) s = Math.max(s, 2);          // 模型标记为残缺
    if (verifyMap[i] && verifyMap[i].status === 'conflict') s = Math.max(s, 2); // 答案存疑
    if (q.issues && q.issues.length) {
      // 只有"看不清"之类的提示算轻微问题；其它提示说明确实要人看
      const soft = q.issues.every((x) => /看不清/.test(x));
      s = Math.max(s, soft ? 1 : 2);
    }
    if (q.confidence !== null && q.confidence !== undefined && q.confidence < 0.7) {
      s = Math.max(s, 1);
    }
    return s;
  }

  /**
   * 计算核对页的显示顺序：有问题的排前面，同严重度内保持原始顺序。
   *
   * 排序只影响"看"的顺序，不改 pending 本身 ——
   * 所以每题都带一个 index 指回它在 pending 里的真实位置，
   * 勾选删除、写回编辑、答案核对标记都用它，不会因为排序而错位。
   */
  function reviewOrder() {
    return pending
      .map((q, i) => ({ q, i, score: problemScore(q, i) }))
      .sort((a, b) => (b.score - a.score) || (a.i - b.i));
  }

  /* ---------------------- 整包识别：图片查看器 ---------------------- */

  /**
   * 页内图片查看器。
   *
   * 为什么做成页内弹层而不是"新窗口打开"：
   *   1) 核对题目时要在题和原图之间来回看，切窗口很打断；
   *   2) 一批有几十张，需要左右翻页连续看，而不是一张张点开；
   *   3) 图片在服务端暂存里（不在页面上），用弹层可以顺手做缓存。
   *
   * 默认显示**识别时实际送去的那一版**（可能已压缩）——
   * 用户核对的是"模型看到了什么"，所以默认就该看那一版；
   * 想看清晰细节时再切到未压缩原图。
   */
  let viewerState = { idx: -1, variant: 'recognized', cache: {}, itemVersions: {}, requestToken: 0 };

  function viewerInvalidateItem(itemId) {
    viewerState.itemVersions[itemId] = (viewerState.itemVersions[itemId] || 0) + 1;
    const prefix = `${itemId}|`;
    for (const key of Object.keys(viewerState.cache)) {
      if (key.startsWith(prefix)) delete viewerState.cache[key];
    }
  }

  /** 取一张图的 data URL（带缓存，翻页时不用重复请求）。 */
  async function viewerLoad(it, variant) {
    const version = viewerState.itemVersions[it.itemId] || 0;
    const key = `${it.itemId}|${variant}|${version}`;
    if (viewerState.cache[key]) return viewerState.cache[key];
    const r = await INVOKE('capture:zipImage', { itemId: it.itemId, variant });
    if (!r.ok) throw new Error(r.error || '取图失败');
    const url = `data:${r.mime};base64,${r.imageBase64}`;
    if ((viewerState.itemVersions[it.itemId] || 0) !== version) return viewerLoad(it, variant);
    viewerState.cache[key] = { url, meta: r };
    return viewerState.cache[key];
  }

  function closeViewer() {
    const el = $('#imgViewer');
    if (el) el.remove();
    viewerState.idx = -1;
    document.removeEventListener('keydown', viewerKeys);
  }

  function viewerKeys(e) {
    if (!$('#imgViewer')) return;
    if (e.key === 'Escape') { closeViewer(); }
    else if (e.key === 'ArrowLeft') { viewerStep(-1); }
    else if (e.key === 'ArrowRight') { viewerStep(1); }
  }

  /**
   * 可查看的图片列表：**全部**条目，不只识别过的。
   *
   * 解包后还没开始识别时就想预览是常见需求（先看看图对不对），
   * 所以这里不做过滤；只是对没识别过的图，没有"识别用的那一版"可切换。
   */
  function viewableItems() {
    return zipBatch.items;
  }

  function viewerStep(delta) {
    const items = viewableItems();
    if (!items.length) return;
    viewerState.idx = (viewerState.idx + delta + items.length) % items.length;
    openViewerAt(viewerState.idx, viewerState.variant, true);
  }

  /** 打开查看器；index 是在 zipBatch.items 里的位置（与队列显示的 # 一致）。 */
  async function openViewerAt(index, variant = 'recognized', keepPos = false) {
    const items = viewableItems();
    if (!items.length) return toast('还没有图片可看，请先选择压缩包', 'err');
    const i = Math.max(0, Math.min(index, items.length - 1));
    viewerState.idx = i;
    viewerState.variant = variant;
    const it = items[i];
    const requestToken = ++viewerState.requestToken;

    if (!$('#imgViewer')) {
      const box = document.createElement('div');
      box.id = 'imgViewer';
      box.innerHTML = `
        <div class="iv-backdrop"></div>
        <div class="iv-panel">
          <div class="iv-head">
            <span class="iv-title"></span>
            <span class="row" style="gap:8px">
              <button class="btn ghost" id="ivToggle" style="padding:3px 10px;font-size:12px">看原图</button>
              <button class="btn ghost" id="ivClose" style="padding:3px 10px;font-size:12px">关闭 (Esc)</button>
            </span>
          </div>
          <div class="iv-body">
            <button class="iv-nav" id="ivPrev" title="上一张 (←)">‹</button>
            <img id="ivImg" alt="" />
            <button class="iv-nav" id="ivNext" title="下一张 (→)">›</button>
          </div>
          <div class="iv-foot"></div>
        </div>`;
      document.body.appendChild(box);
      box.querySelector('.iv-backdrop').onclick = closeViewer;
      $('#ivClose').onclick = closeViewer;
      $('#ivPrev').onclick = () => viewerStep(-1);
      $('#ivNext').onclick = () => viewerStep(1);
      $('#ivToggle').onclick = () => {
        const next = viewerState.variant === 'recognized' ? 'original' : 'recognized';
        openViewerAt(viewerState.idx, next, true);
      };
      document.addEventListener('keydown', viewerKeys);
    }

    const img = $('#ivImg');
    const foot = $('.iv-foot');
    $('.iv-title').textContent = it.name;
    // 只有"这张图确实被压缩过"时才值得切换版本
    $('#ivToggle').style.display = it.savedBytes ? '' : 'none';
    $('#ivToggle').textContent = variant === 'recognized' ? '看原图' : '看识别用的版本';
    img.style.opacity = '0.35';
    foot.textContent = `第 ${i + 1} / ${items.length} 张`;

    try {
      // 没识别过的图没有"识别用的那一版"，直接看暂存里的原样
      const useVariant = it.status === 'pending' ? 'recognized' : variant;
      const got = await viewerLoad(it, useVariant);
      if (requestToken !== viewerState.requestToken || !$('#imgViewer')) return;
      img.src = got.url;
      img.style.opacity = '1';
      const kb = (got.meta.size / 1024).toFixed(0);
      const statusText =
        it.status === 'pending'
          ? '｜还没识别'
          : it.status === 'running'
            ? '｜识别中'
            : `｜识别出 ${it.questions || 0} 题`;
      foot.innerHTML =
        `第 ${i + 1} / ${items.length} 张｜${got.meta.mime}｜${kb} KB` +
        statusText +
        (got.meta.compressed ? '｜<b class="crit">这是压缩后送识别的版本</b>' : '') +
        (useVariant === 'original' && it.savedBytes ? '｜<b class="okc">未压缩原图</b>' : '');
    } catch (e) {
      if (requestToken !== viewerState.requestToken || !$('#imgViewer')) return;
      img.removeAttribute('src');
      img.style.opacity = '1';
      foot.innerHTML = `<span class="crit">${esc(e.message)}</span>`;
    }
    void keepPos;
  }

  /** 把来源文件名缩短，便于在题卡上显示。 */
  function shortSource(name) {    const s = String(name || '');
    if (!s) return '';
    const base = s.split(/[\\/]/).pop() || s;
    return base.length > 34 ? `${base.slice(0, 16)}…${base.slice(-14)}` : base;
  }

  /**
   * 测试钩子：把核对页的排序逻辑与渲染暴露出来，供自动化测试直接调用。
   *
   * 为什么需要：排序是"要算"的逻辑，只断言源码里有没有某些字符串
   * 无法证明它算得对。有了这个钩子，测试可以在真实浏览器里验证
   * "有问题的题确实排到了前面、且下标不会错位"。
   * 这些都是只读/等价于用户操作的入口，不改变产品行为。
   */
  window.__reviewTest = {
    problemScore,
    reviewOrder: () => reviewOrder().map((o) => ({ i: o.i, score: o.score })),
    shortSource,
    // 供测试驱动真实渲染（与用户从整包识别得到结果时走的是同一条路）
    setPending: (list) => {
      pending = list;
      pendingSource = 'image';
    },
    render: () => renderReview([]),
    // 供测试把"刚解包完"的队列状态填进去，验证图片查看器等界面
    setZipBatch: (items) => {
      zipBatch = { importId: 'test', items, running: false, paused: false };
      renderZipQueue();
    },
  };

  /** 把界面上的编辑结果写回 pending（入库前必调，否则用户的修改会丢）。 */
  function collect() {
    const boxes = $('#qlist')?.querySelectorAll('.qitem') || [];
    boxes.forEach((box) => {
      const q = pending[Number(box.dataset.i)];
      if (!q) return;
      q.stem = box.querySelector('[data-f=stem]').value.trim();
      q.options = {};
      for (const L of ['A', 'B', 'C', 'D']) {
        const v = box.querySelector(`[data-f=opt${L}]`).value.trim();
        if (v) q.options[L] = v.replace(new RegExp(`^${L}\\s*[.、)．]\\s*`, 'i'), '');
      }
      q.answer = box.querySelector('[data-f=answer]').value;
      q.groupName = (box.querySelector('[data-f=group]')?.value || '').trim();
      q.knowledgePoints = box.querySelector('[data-f=kp]').value.split(/[,，、;；]/).map((s) => s.trim()).filter(Boolean);
      q.difficulty = box.querySelector('[data-f=difficulty]').value;
      q.explanation = box.querySelector('[data-f=explanation]').value.trim();
      // 出处可编辑：用户核对完可以改成更好记的说法（如"第一单元 试卷3 第7题"）
      const src = box.querySelector('[data-f=sourceNote]');
      if (src) q.sourceNote = src.value.trim();
    });
  }

  /* ---------------- 草稿恢复（进入录入页时） ---------------- */
  // pending 已是模块级、切页面不丢；这里只在「模块级也是空」时从 localStorage 恢复，
  // 避免覆盖用户当前正在核对的内容。恢复出的题可正常编辑/删除/入库。
  let restored = false;
  if (pending.length === 0) {
    const draft = loadDraft();
    if (draft && draft.pending.length > 0) {
      pending = draft.pending;
      pendingSource = draft.pendingSource || 'image';
      restored = true;
    }
  }
  // 关键：screens.capture 每次进入都会重建 HTML（核对区初始为空），
  // 所以无论 pending 是「切页后仍留在内存里」还是「刚从 localStorage 恢复」，
  // 只要有待处理内容就要重新渲染核对区，否则题目在内存里却不显示。
  if (pending.length > 0) {
    renderReview([]);
    if (restored) {
      toast(`已恢复上次未完成的录入（${pending.length} 道题）`, 'okc');
    }
  }
};

/* ---------------------------- 选图工具（两种外壳通用） ---------------------------- */
/** 把 File 转成 {name, mime, base64}（base64 不含 data: 前缀）。 */
async function filesToBase64(files) {
  const out = [];
  for (const f of files) {
    if (!f || !f.type || !f.type.startsWith('image/')) continue;
    const dataUrl = await toB64(f);
    out.push({ name: f.name, mime: f.type, base64: String(dataUrl).split(',')[1] });
  }
  return out;
}

/* ---------------------------- 图片压缩（上传前瘦身） ---------------------------- */

/**
 * 压缩上限：长边超过这个像素就缩小。
 * 读图模型内部也会把图片压到约 1024 token 处理，再大的分辨率用不上，
 * 所以缩到这个尺寸几乎不损识别准确率，却能显著减少上传体积。
 */
const COMPRESS_MAX_DIM = 1600;
/** JPEG 质量。0.85 对印刷体试卷足够清晰。 */
const COMPRESS_QUALITY = 0.85;
/** 小于这个大小就不再压（压了也省不了多少，还多一次画布开销）。 */
const COMPRESS_MIN_BYTES = 400 * 1024;

/**
 * 压缩一张 data URL 图片。
 *
 * 策略：
 *   - 用浏览器自带的 canvas（零依赖，不引入 sharp 之类）
 *   - 先探测原始像素尺寸：**尺寸不大且体积不大就直接返回原图**，
 *     避免"本来很小的图"被重新编码反而变模糊
 *   - PNG 常见于截图（文字锐利、体积大），转成 JPEG 能省很多且不影响识别
 *
 * 失败时返回原图 —— 压缩只是优化，不能因为它让流程走不下去。
 *
 * @param {string} dataUrl 形如 data:image/png;base64,...
 * @returns {Promise<{dataUrl:string, originalBytes:number, bytes:number, width:number, height:number, compressed:boolean, reason:string}>}
 */
async function compressImageDataUrl(dataUrl) {
  const m = /^data:([^;,]+);base64,(.*)$/s.exec(String(dataUrl || ''));
  if (!m) return { dataUrl, originalBytes: 0, bytes: 0, compressed: false, reason: '格式不认识' };
  const mime = m[1];
  const originalBytes = Math.floor((m[2].length * 3) / 4);

  const img = await new Promise((resolve) => {
    const i = new Image();
    i.onload = () => resolve(i);
    i.onerror = () => resolve(null);
    i.src = dataUrl;
  });
  if (!img) {
    return { dataUrl, originalBytes, bytes: originalBytes, compressed: false, reason: '图片无法解码' };
  }
  const w0 = img.naturalWidth || img.width;
  const h0 = img.naturalHeight || img.height;
  const maxSide = Math.max(w0, h0);

  // 又小又不大：原样用
  if (originalBytes <= COMPRESS_MIN_BYTES && maxSide <= COMPRESS_MAX_DIM) {
    return { dataUrl, originalBytes, bytes: originalBytes, compressed: false, reason: '本来就小', width: w0, height: h0 };
  }

  const scale = maxSide > COMPRESS_MAX_DIM ? COMPRESS_MAX_DIM / maxSide : 1;
  const w = Math.max(1, Math.round(w0 * scale));
  const h = Math.max(1, Math.round(h0 * scale));

  try {
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    // JPEG 不支持透明，先铺白底，否则透明区域会变黑
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
    const out = canvas.toDataURL('image/jpeg', COMPRESS_QUALITY);
    const outBytes = Math.floor(((out.split(',')[1] || '').length * 3) / 4);
    // 万一压完反而更大（例如原本就是优化过的 JPEG），就用原图
    if (outBytes >= originalBytes) {
      return {
        dataUrl, originalBytes, bytes: originalBytes, compressed: false,
        reason: '压了之后反而更大', width: w0, height: h0,
      };
    }
    return {
      dataUrl: out,
      originalBytes,
      bytes: outBytes,
      compressed: true,
      reason: scale < 1 ? `缩到 ${w}×${h} 并转 JPEG` : '转 JPEG 瘦身',
      width: w,
      height: h,
    };
  } catch (e) {
    return { dataUrl, originalBytes, bytes: originalBytes, compressed: false, reason: `压缩失败：${e.message}` };
  }
}

function fmtBytes(n) {
  if (!n) return '0 B';
  if (n < 1024) return `${n} B`;
  if (n < 1048576) return `${(n / 1024).toFixed(0)} KB`;
  return `${(n / 1048576).toFixed(1)} MB`;
}

/**
 * 选图。优先用宿主能力（window.dsh.pickImage）；
 * 没有时退化为页面内的隐藏 file input。两条路返回同一种结构。
 */
async function pickImages() {  if (window.dsh && window.dsh.pickImage) {
    try {
      const r = await window.dsh.pickImage();
      if (r && r.ok) return r.files || [];
      if (r && r.error) toast(r.error, 'err');
      return [];
    } catch (e) {
      toast(`选图失败：${e.message}`, 'err');
      return [];
    }
  }
  return new Promise((resolve) => {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/*';
    inp.multiple = true;
    inp.onchange = async () => resolve(await filesToBase64([...inp.files]));
    inp.oncancel = () => resolve([]);
    inp.click();
  });
}


function toB64(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = rej;
    fr.readAsDataURL(file);
  });
}

function srsText(q) {
  const s = q.state || {};
  const days = s.dueAt ? Math.round((s.dueAt - Date.now()) / 86400000) : null;
  const m = Math.round((s.stability ? Math.min(s.stability / 10, 1) : 0) * 100);
  const due = s.reps === 0 ? '未学过' : days <= 0 ? '待复习' : days === 1 ? '明天复习' : `${days} 天后复习`;
  return `复习 ${s.reps || 0} 次｜错 ${s.lapses || 0} 次｜强度 ${m}%｜${due}`;
}

      const cls = pct >= 70 ? '' : pct >= 40 ? 'mid' : 'low';
      return `<tr><td>${esc(it.name)}</td><td>${it.total}</td>
        <td><span class="mb" style="width:100px"><i class="${cls}" style="width:${pct}%"></i></span> ${pct}%</td>
        <td>${it.lapses}</td><td>${it.due}</td></tr>`;
    }).join('')}</tbody></table>` : '<div class="muted">还没有数据。</div>';

  const wb = await INVOKE('stats:wrongBook', { limit: 100 });
  $('#wrongBook').innerHTML = wb.ok && wb.items.length ? `<table>
    <thead><tr><th>题干</th><th>答案</th><th>错了几次</th><th>知识点</th></tr></thead>
    <tbody>${wb.items.map((q) => `<tr>
      <td>${esc(q.stem.slice(0, 60))}${q.stem.length > 60 ? '…' : ''}</td>
      <td class="okc">${esc(q.answer)}</td><td>${q.wrongCount}</td>
      <td>${(q.knowledgePoints || []).map((x) => `<span class="kp weak">${esc(x)}</span>`).join('')}</td>
    </tr>`).join('')}</tbody></table>` : '<div class="muted">还没有错题记录。练几道题就有了。</div>';
};

    // 把"要删什么、各多少"如实列出来 —— 用户得看清代价才能决定
    const parts = [

    const rr = await INVOKE('settings:set', patch);
    toast(rr.ok ? '已保存' : rr.error, rr.ok ? 'okc' : 'err');
  };

  const doTest = async (vision) => {
    $('#testOut').innerHTML = '<span class="spin"></span> 正在测试…';
    const rr = await INVOKE('settings:test', { vision });
    const t = rr.result;
    $('#testOut').innerHTML = t.ok
      ? `<span class="okc">连接正常</span>｜模型 ${esc(t.model)}｜耗时 ${t.ms}ms｜回复：${esc(t.reply)}`
      : `<span class="crit">连接失败</span>｜${esc(t.error)}`;

  $('#testText').onclick = () => doTest(false);
  $('#testVision').onclick = () => doTest(true);

  $('#alignPreset').onclick = async () => {

    if (!rr.ok) return toast(rr.error, 'err');
    if (!rr.changed) return toast(rr.reason || '已经是最新配置', 'okc');
    toast(rr.message, 'okc');
    // 重新渲染设置页，让新值显示出来
    go('settings');
  };
  $('#openDir').onclick = async () => {
    if (window.dsh?.openDataDir) await window.dsh.openDataDir();
    else toast('数据目录：' + dir.dataDir);

/* ---------------------------- 讲评：第二次做错时展开 ---------------------------- *
 * 用户要求：第二次做错时，把知识点展示出来，并告诉我前两次选了什么。
 * 材料来自 teach:mistake —— 它按题目累计错误次数统计，跨会话都算数。
 * ---------------------------------------------------------------------------- */
async function showTeachDock(questionId, sessionId) {
  const old = $('#teachModal');
  if (old) old.remove();

  const t = await INVOKE('teach:mistake', { questionId, sessionId });
  if (!t.ok) return toast(t.error, 'err');
  const q = t.question;

  const historyHtml = t.history.length
    ? t.history.slice(0, 6).map((h) => `
        <div class="hrow ${h.correct ? 'ok' : ''}">
          <span class="when">${esc(h.day || '')} 第${h.round}轮</span>
          <span class="what">你选了 <b class="${h.correct ? 'okc' : 'crit'}">${esc(fmtPicked(h.picked))}</b>${h.pickedText ? ` · ${esc(h.pickedText)}` : ''}</span>
          <span class="mark">${h.correct ? '<span class="okc">对</span>' : '<span class="crit">错</span>'}</span>
        </div>`).join('')
    : '<div class="muted">还没有作答记录。</div>';

  const wrongList = t.wrongAttempts.length
    ? t.wrongAttempts.map((w) => `「${esc(fmtPicked(w.picked))}${w.pickedText ? ' ' + esc(w.pickedText) : ''}」`).join('、')
    : '—';

  const modal = document.createElement('div');
  modal.id = 'teachModal';
  modal.style.cssText = 'position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:200;padding:24px';
  modal.innerHTML = `
    <div class="card" style="max-width:660px;width:100%;max-height:86vh;overflow:auto;margin:0">
      <div class="row" style="justify-content:space-between;margin-bottom:10px">
        <h2 style="margin:0">这道题你已经错 ${t.wrongCount} 次了</h2>
        <button class="btn ghost" id="closeTeach" style="padding:4px 12px">关闭</button>
      </div>
      <div class="stem" style="font-size:16px;margin-bottom:12px">${esc(q.stem)}</div>
      <div class="opts" style="gap:7px">${Object.entries(q.options).map(([L, v]) => `
        <div class="opt" style="padding:9px 12px;font-size:14px;${L === q.answer ? 'border-color:var(--ok);background:#16281f' : ''}">
          <span class="k" ${L === q.answer ? 'style="background:var(--ok);color:#08231a"' : ''}>${L}</span>
          <span>${esc(v)}</span>
          ${L === q.answer ? '<span class="tag okc">正确答案</span>' : ''}
        </div>`).join('')}</div>

      <div class="teach">
        <h4>这个考点是</h4>
        <div>${q.knowledgePoints.length
          ? q.knowledgePoints.map((k) => `<span class="chip">${esc(k)}</span>`).join('')
          : '<span class="muted">这道题还没标注知识点，可以到题库管理里补一下。</span>'}</div>
      </div>

      <div class="teach">
        <h4>你前几次分别选了</h4>
        <div style="margin-bottom:8px">${wrongList}</div>
        <div class="history">${historyHtml}</div>
        ${t.wrongAttempts.length >= 2
          ? `<div class="muted" style="font-size:12.5px;margin-top:6px">
               注意：你两次选的都不是 <b class="okc">${esc(q.answer)}</b>，说明不是手滑，是这个考点还没掌握。
             </div>`
          : ''}
      </div>

      ${q.explanation ? `<div class="teach"><h4>解析</h4><div>${esc(q.explanation)}</div></div>` : ''}

      <div id="glossArea"></div>

      <div class="row" style="margin-top:14px">
        <button class="btn" id="askAboutIt">就这道题提问</button>
        <button class="btn ghost" id="copyForHost">复制内容发给我</button>
      </div>
    </div>`;

  document.body.appendChild(modal);
  $('#closeTeach').onclick = () => modal.remove();
  modal.onclick = (e) => { if (e.target === modal) modal.remove(); };

  // 词汇题：逐项给出释义（含熟词生义）与本题语境下的含义
  (async () => {
    const area = $('#glossArea');
    if (!area) return;
    area.innerHTML = '<div class="teach"><span class="spin"></span> 正在整理各选项释义…</div>';
    const r = await INVOKE('knowledge:explainWords', { questionId: q.id });
    if (!area.isConnected) return;
    const g = r.gloss || {};
    const opts = q.options || {};
    if (!r.usedModel && g.needsModel) {
      area.innerHTML = `<div class="teach">
        <h4>选项释义</h4>
        <div class="muted" style="font-size:12.5px;margin-bottom:8px">
          这是一道词义题，需要逐项释义。配置文本模型后这里会自动给出每个选项的意思（含熟词生义）；
          现在可以点下面的「就这道题提问」或「复制内容发给我」，我来逐个讲。
        </div>
      </div>`;
      return;
    }
    const rows = Object.keys(opts).map((L) => {
      const it = g.options?.[L] || {};
      const isRight = L === q.answer;
      return `<div class="hrow ${isRight ? 'ok' : ''}" style="align-items:flex-start">
        <span class="when" style="min-width:22px">${L}</span>
        <span class="what">
          <b>${esc(opts[L])}</b>
          ${it.gloss ? ` — ${esc(it.gloss)}` : ''}
          ${it.here ? `<div class="muted" style="font-size:12.5px">本题语境：${esc(it.here)}</div>` : ''}
          ${it.note ? `<div class="muted" style="font-size:12.5px">提示：${esc(it.note)}</div>` : ''}
        </span>
        ${isRight ? '<span class="mark okc">正确</span>' : ''}
      </div>`;
    }).join('');
    area.innerHTML = `<div class="teach">
      <h4>选项释义${r.usedModel ? '' : '（未配置模型，仅供参考）'}</h4>
      ${g.sentence ? `<div style="margin-bottom:8px">${esc(g.sentence)}</div>` : ''}
      <div class="history">${rows}</div>
      ${r.note ? `<div class="muted" style="font-size:12.5px">${esc(r.note)}</div>` : ''}
    </div>`;
  })();

  $('#askAboutIt').onclick = () => {
    modal.remove();
    openChatPanel({ questionId: q.id, title: q.stem.slice(0, 40) });
  };

  $('#copyForHost').onclick = async () => {
    const lines = [
      '这道英语单选题我反复做错，帮我讲讲：',
      '',
      `题干：${q.stem}`,
      ...Object.entries(q.options).map(([L, v]) => `${L}. ${v}`),
      `正确答案：${q.answer}. ${q.answerText}`,
      q.knowledgePoints.length ? `考点：${q.knowledgePoints.join('、')}` : '',
      t.wrongAttempts.length ? `我错选的答案：${wrongList}` : '',
      `做错次数：${t.wrongCount}`,
    ].filter(Boolean).join('\n');
    await copyText(lines);
  };
}

/** 复制到剪贴板（带降级方案）。 */
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast('已复制，粘贴给我就行', 'okc');
  } catch {
    // 剪贴板 API 在非安全上下文可能不可用，退化为手动选择
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;left:-9999px';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch { ok = false; }
    ta.remove();
    toast(ok ? '已复制，粘贴给我就行' : '复制失败，请手动选中文本复制', ok ? 'okc' : 'err');
  }
}

/* ---------------------------- 问答（对话窗口） ---------------------------- */
function openChatPanel(opts = {}) {
  const dock = document.createElement('div');
  dock.id = 'chatPanel';
  dock.style.cssText = 'position:fixed;right:0;top:0;bottom:0;width:430px;background:var(--panel);'
    + 'border-left:1px solid var(--line);z-index:190;display:flex;flex-direction:column;box-shadow:-12px 0 30px #0007';
  dock.innerHTML = `
    <div class="chathead">
      <b style="font-size:13.5px">就这道题提问</b>
      <span class="ctx" id="panelCtx"></span>
      <button class="btn ghost" id="closePanel" style="padding:3px 10px;font-size:12px">关闭</button>
    </div>
    <div class="msgs" id="panelMsgs"></div>
    <div class="chatfoot">
      <textarea id="panelInput" placeholder="例如：为什么不能选 A？这个考点怎么记？"></textarea>
      <button class="btn" id="panelSend">发送</button>
    </div>`;
  document.body.appendChild(dock);

  let threadId = null;
  let questionId = opts.questionId || null;
  let busy = false;

  const input = $('#panelInput', dock);
  const msgs = $('#panelMsgs', dock);
  $('#panelCtx', dock).textContent = opts.title || (questionId ? `题目 #${questionId}` : '通用提问');
  setTimeout(() => input.focus(), 100);

  const addBubble = (role, text, isError) => {
    const el = document.createElement('div');
    el.className = `msg ${role}${isError ? ' error' : ''}`;
    el.textContent = text;
    msgs.appendChild(el);
    msgs.scrollTop = msgs.scrollHeight;
    return el;
  };

  const send = async () => {
    const text = input.value.trim();
    if (!text || busy) return;
    busy = true;
    input.value = '';
    addBubble('user', text);
    const pending = addBubble('assistant', '…');
    const r = await INVOKE('chat:ask', { threadId, questionId, message: text });
    pending.remove();
    if (r.ok) {
      threadId = r.threadId;
      addBubble('assistant', r.reply);
    } else {
      if (r.threadId) threadId = r.threadId;
      addBubble('assistant', r.error || '回答失败', true);
      // 没配模型时给出可复制的上下文，方便贴给别人
      if (r.code === 'NO_MODEL' && r.context) {
        const btn = document.createElement('button');
        btn.className = 'btn ghost';
        btn.style.cssText = 'align-self:flex-start;font-size:12.5px';
        btn.textContent = '复制这道题的内容';
        btn.onclick = () => copyText(`${r.context}\n\n我的问题：${text}`);
        msgs.appendChild(btn);
        msgs.scrollTop = msgs.scrollHeight;
      }
    }
    busy = false;
    input.focus();
  };

  $('#panelSend', dock).onclick = send;
  input.onkeydown = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  };
  $('#closePanel', dock).onclick = () => dock.remove();

  return { close: () => dock.remove() };
}

screens.chat = async () => {
  const main = $('#main');
  let threadId = null;
  let questionId = null;
  let busy = false;

  main.innerHTML = `<h1>问答</h1>
    <div class="sub">可以就某道题提问，也可以泛问语法问题。问某道题时会自动带上题目、考点和你的作答记录，所以不用把题目再抄一遍。</div>
    <div class="chatwrap">
      <div class="chatlist" id="threads"></div>
      <div class="chatmain">
        <div class="chathead">
          <b style="font-size:13.5px" id="chatTitle">新对话</b>
          <span class="ctx" id="chatCtx"></span>
          <button class="btn ghost" id="newThread" style="padding:3px 10px;font-size:12px">新对话</button>
          <button class="btn ghost" id="pickQuestion" style="padding:3px 10px;font-size:12px">选一道题</button>
        </div>
        <div class="msgs" id="msgs"></div>
        <div class="chatfoot">
          <textarea id="chatInput" placeholder="输入问题，回车发送（Shift+回车换行）"></textarea>
          <button class="btn" id="sendBtn">发送</button>
        </div>
      </div>
    </div>`;

  const msgsEl = $('#msgs');
  const input = $('#chatInput');

  const addBubble = (role, text, isError) => {
    const el = document.createElement('div');
    el.className = `msg ${role}${isError ? ' error' : ''}`;
    el.textContent = text;
    msgsEl.appendChild(el);
    msgsEl.scrollTop = msgsEl.scrollHeight;
    return el;
  };

  const setContext = (q) => {
    questionId = q ? q.id : null;
    $('#chatCtx').textContent = q ? `关于：${q.stem.slice(0, 34)}…` : '';
  };

  const loadThreads = async () => {
    const r = await INVOKE('chat:threads', {});
    if (!r.ok) return;
    $('#threads').innerHTML = r.threads.length
      ? r.threads.map((t) => `<div class="item ${t.id === threadId ? 'on' : ''}" data-t="${t.id}">
          <div>${esc(t.title || '对话 #' + t.id)}</div>
          <div class="sub">${t.messageCount} 条 · ${new Date(t.updatedAt).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</div>
        </div>`).join('')
      : '<div class="item muted">还没有对话</div>';
    $('#threads').querySelectorAll('[data-t]').forEach((el) => {
      el.onclick = () => openThread(Number(el.dataset.t));
    });
  };

  const openThread = async (id) => {
    const r = await INVOKE('chat:messages', { threadId: id });
    if (!r.ok) return toast(r.error, 'err');
    threadId = id;
    questionId = r.thread.questionId || null;
    $('#chatTitle').textContent = r.thread.title || `对话 #${id}`;
    $('#chatCtx').textContent = questionId ? `关于题目 #${questionId}` : '';
    msgsEl.innerHTML = '';
    for (const m of r.messages) addBubble(m.role === 'assistant' ? 'assistant' : 'user', m.content, m.error);
    loadThreads();
  };

  const send = async () => {
    const text = input.value.trim();
    if (!text || busy) return;
    busy = true;
    input.value = '';
    addBubble('user', text);
    const pending = addBubble('assistant', '…');
    const r = await INVOKE('chat:ask', { threadId, questionId, message: text });
    pending.remove();
    if (r.ok) {
      threadId = r.threadId;
      addBubble('assistant', r.reply);
    } else {
      if (r.threadId) threadId = r.threadId;
      addBubble('assistant', r.error || '回答失败', true);
      if (r.code === 'NO_MODEL' && r.context) {
        const btn = document.createElement('button');
        btn.className = 'btn ghost';
        btn.style.cssText = 'align-self:flex-start;font-size:12.5px';
        btn.textContent = '复制这道题的内容';
        btn.onclick = () => copyText(`${r.context}\n\n我的问题：${text}`);
        msgsEl.appendChild(btn);
      }
    }
    busy = false;
    await loadThreads();
    input.focus();
  };

  $('#sendBtn').onclick = send;
  input.onkeydown = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  };
  $('#newThread').onclick = () => {
    threadId = null;
    questionId = null;
    msgsEl.innerHTML = '';
    $('#chatTitle').textContent = '新对话';
    $('#chatCtx').textContent = '';
    loadThreads();
    input.focus();
  };
  $('#pickQuestion').onclick = async () => {
    const list = await INVOKE('questions:list', { limit: 200 });
    if (!list.ok) return toast(list.error, 'err');
    if (!list.questions.length) return toast('题库还是空的', 'err');
    const idx = await pickFromList(list.questions.map((q) => `${q.id}. ${q.stem.slice(0, 60)}`), '选一道题来提问');
    if (idx === null) return;
    const q = list.questions[idx];
    threadId = null;
    msgsEl.innerHTML = '';
    $('#chatTitle').textContent = `题目 #${q.id}`;
    setContext(q);
    const t = await INVOKE('teach:mistake', { questionId: q.id });
    if (t.ok) {
      addBubble('assistant', `这道题的考点：${t.question.knowledgePoints.join('、') || '未标注'}\n正确答案：${t.question.answer}. ${t.question.answerText}\n你做错过 ${t.wrongCount} 次。\n\n有什么想问的？`);
    }
    loadThreads();
    input.focus();
  };

  await loadThreads();
  input.focus();
};

/** 简易选择列表（避免用 prompt 那种丑且不可控的交互）。 */
function pickFromList(items, title) {
  return new Promise((resolve) => {
    const modal = document.createElement('div');
    modal.style.cssText = 'position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:210;padding:24px';
    modal.innerHTML = `<div class="card" style="max-width:620px;width:100%;max-height:80vh;overflow:auto;margin:0">
      <h2>${esc(title)}</h2>
      <div class="qlist">${items.map((t, i) => `<div class="qitem" data-i="${i}" style="cursor:pointer">${esc(t)}</div>`).join('')}</div>
      <div class="row" style="margin-top:12px"><button class="btn ghost" id="cancelPick">取消</button></div>
    </div>`;
    document.body.appendChild(modal);
    const done = (v) => { modal.remove(); resolve(v); };
    modal.querySelectorAll('[data-i]').forEach((el) => (el.onclick = () => done(Number(el.dataset.i))));
    $('#cancelPick', modal).onclick = () => done(null);
    modal.onclick = (e) => { if (e.target === modal) done(null); };
  });
}

/* ---------------------------- 单元分组 ---------------------------- */
screens.groups = async () => {
  const main = $('#main');

  const load = async () => {
    const r = await INVOKE('groups:list');
    if (!r.ok) return toast(r.error, 'err');
    const groups = r.groups || [];
    const totalMastery = groups.filter((g) => g.total > 0);
    const avgAll = totalMastery.length
      ? totalMastery.reduce((a, g) => a + g.avgMastery * g.total, 0) / totalMastery.reduce((a, g) => a + g.total, 0)
      : 0;

    main.innerHTML = `<h1>单元分组</h1>
      <div class="sub">按单元/章节归拢题目，看清每个单元的掌握情况。</div>

      <div class="card">
        <div class="row" style="align-items:flex-end">
          <label class="fld" style="flex:1;min-width:200px;margin-bottom:0"><span>新建分组</span>
            <input type="text" id="newGroupName" placeholder="例如 第一单元 / Unit 3 / 虚拟语气专项" /></label>
          <label class="fld" style="flex:1;min-width:160px;margin-bottom:0"><span>备注（可选）</span>
            <input type="text" id="newGroupNote" placeholder="例如 课本 P12-20" /></label>
          <button class="btn" id="createGroup">创建</button>
        </div>
        ${r.ungrouped > 0 ? `<div class="warnbox" style="margin-top:12px">
          还有 <b>${r.ungrouped}</b> 道题没有分组。可以在「题库管理」里批量归入，或在录入时直接指定分组。
        </div>` : ''}
      </div>

      <div class="kpis" style="margin-bottom:16px">
        <div class="kpi"><b>${groups.length}</b><span>分组数</span></div>
        <div class="kpi"><b>${groups.reduce((a, g) => a + g.total, 0)}</b><span>已归类题数</span></div>
        <div class="kpi"><b>${r.ungrouped}</b><span>未分组</span></div>
        <div class="kpi"><b>${Math.round(avgAll * 100)}%</b><span>整体掌握度</span></div>
      </div>

      ${groups.length === 0
        ? '<div class="card"><div class="empty">还没有分组。录入题目时填一个分组名就会自动创建。</div></div>'
        : `<div class="card"><h2>各单元情况（掌握度低的排前面）</h2>
            <div id="groupTable"></div></div>`}`;

    if (groups.length) {
      const sorted = [...groups].sort((a, b) => a.avgMastery - b.avgMastery);
      $('#groupTable').innerHTML = `<table>
        <thead><tr><th>分组</th><th>题量</th><th>已学</th><th>待复习</th><th>累计错</th><th>掌握度</th><th></th></tr></thead>
        <tbody>${sorted.map((g) => {
          const pct = Math.round(g.avgMastery * 100);
          const cls = pct >= 70 ? '' : pct >= 40 ? 'mid' : 'low';
          return `<tr>
            <td><b>${esc(g.name)}</b>${g.note ? `<div class="muted" style="font-size:11.5px">${esc(g.note)}</div>` : ''}
              ${g.topKnowledge.length ? `<div style="margin-top:3px">${g.topKnowledge.slice(0, 3).map((k) => `<span class="chip">${esc(k.name)}×${k.count}</span>`).join('')}</div>` : ''}</td>
            <td>${g.total}</td>
            <td>${g.learned}</td>
            <td>${g.due}</td>
            <td>${g.wrongTotal}</td>
            <td><span class="mb" style="width:80px"><i class="${cls}" style="width:${pct}%"></i></span> ${pct}%</td>
            <td class="row" style="gap:6px">
              <button class="btn ghost" data-rename="${g.id}" style="padding:2px 9px;font-size:12px">改名</button>
              <button class="btn danger" data-del="${g.id}" style="padding:2px 9px;font-size:12px">删除</button>
            </td>
          </tr>`;
        }).join('')}</tbody></table>`;

      $('#groupTable').querySelectorAll('[data-rename]').forEach((b) => {
        b.onclick = async () => {
          const g = groups.find((x) => x.id === Number(b.dataset.rename));
          const input = await pickText(`把「${g.name}」改成：`, g.name);
          if (input === null || input === g.name) return;
          const rr = await INVOKE('groups:rename', { id: g.id, name: input });
          toast(rr.ok ? '已改名' : rr.error, rr.ok ? 'okc' : 'err');
          load();
        };
      });
      $('#groupTable').querySelectorAll('[data-del]').forEach((b) => {
        b.onclick = async () => {
          const g = groups.find((x) => x.id === Number(b.dataset.del));
          if (!confirm(`删除分组「${g.name}」？\n\n分组里的 ${g.total} 道题不会被删，只是变成"未分组"。`)) return;
          const rr = await INVOKE('groups:delete', { id: g.id });
          toast(rr.ok ? `已删除分组，${rr.ungrouped} 道题转为未分组` : rr.error, rr.ok ? 'okc' : 'err');
          load();
        };
      });
    }

    $('#createGroup').onclick = async () => {
      const name = $('#newGroupName').value.trim();
      if (!name) return toast('先填分组名', 'err');
      const rr = await INVOKE('groups:create', { name, note: $('#newGroupNote').value.trim() });
      toast(rr.ok ? `已创建「${name}」` : rr.error, rr.ok ? 'okc' : 'err');
      if (rr.ok) load();
    };
  };

  await load();
};

/** 简易文本输入框（替代 prompt，样式一致且能校验）。 */
function pickText(title, defaultValue = '') {
  return new Promise((resolve) => {
    const modal = document.createElement('div');
    modal.style.cssText = 'position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:210;padding:24px';
    modal.innerHTML = `<div class="card" style="max-width:420px;width:100%;margin:0">
      <h2>${esc(title)}</h2>
      <input type="text" id="pickTextInput" value="${esc(defaultValue)}" />
      <div class="row" style="margin-top:14px">
        <button class="btn" id="pickOk">确定</button>
        <button class="btn ghost" id="pickCancel">取消</button>
      </div>
    </div>`;
    document.body.appendChild(modal);
    const input = modal.querySelector('#pickTextInput');
    const done = (v) => { modal.remove(); resolve(v); };
    modal.querySelector('#pickOk').onclick = () => done(input.value.trim());
    modal.querySelector('#pickCancel').onclick = () => done(null);
    input.onkeydown = (e) => { if (e.key === 'Enter') done(input.value.trim()); };
    modal.onclick = (e) => { if (e.target === modal) done(null); };
    setTimeout(() => input.focus(), 50);
  });
}

screens.trash = async () => {
  const main = $('#main');

  const load = async () => {
    const r = await INVOKE('trash:list', {});
    if (!r.ok) return toast(r.error, 'err');
    const items = r.items || [];

    main.innerHTML = `<h1>回收站</h1>
      <div class="sub">这里是从题库"删除"的题目。数据还在，可以恢复；也可以彻底删除。</div>
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <span class="row" style="gap:10px">
            <label class="row" style="gap:6px;color:var(--muted);font-size:12.5px">
              <input type="checkbox" id="trashPickAll" style="width:auto" /> 全选
            </label>
            <span class="muted" id="trashSel" style="font-size:12.5px">未选中</span>
          </span>
          <span class="row" style="gap:8px">
            <button class="btn" id="restorePicked" disabled>恢复选中的题</button>
            <button class="btn danger" id="purgePicked" disabled>彻底删除</button>
            <button class="btn danger" id="emptyTrash">清空回收站</button>
          </span>
        </div>
      </div>
      <div class="card">
        ${items.length === 0
          ? '<div class="empty">回收站是空的。</div>'
          : `<div class="qlist" id="trashList">${items.map((q) => `
              <div class="qitem">
                <div class="row" style="gap:8px;align-items:flex-start">
                  <input type="checkbox" class="tpick" value="${q.id}" style="width:auto;margin-top:4px" />
                  <div style="flex:1">
                    <div class="st">${esc(q.stem)}</div>
                    <div class="row" style="gap:12px;flex-wrap:wrap;margin-top:4px">
                      ${Object.entries(q.options).map(([k, v]) => `<span class="muted" style="font-size:12.5px">${k}. ${esc(v)}</span>`).join('')}
                    </div>
                    <div class="meta" style="margin-top:4px">
                      答案 <b class="okc">${esc(q.answer)}</b>｜
                      ${q.groupName ? `<span class="chip">${esc(q.groupName)}</span>` : ''}
                      ${(q.knowledgePoints || []).map((k) => `<span class="kp">${esc(k)}</span>`).join('')}
                      ｜已练习 ${q.state.reps} 次，错 ${q.state.lapses} 次
                    </div>
                  </div>
                </div>
              </div>`).join('')}</div>`}
      </div>`;

    const tpicked = () => [...document.querySelectorAll('.tpick:checked')].map((c) => Number(c.value));
    const updateSel = () => {
      const n = tpicked().length;
      const el = $('#trashSel');
      if (el) el.textContent = n ? `已选中 ${n} 道` : '未选中';
      const r1 = $('#restorePicked');
      const r2 = $('#purgePicked');
      if (r1) r1.disabled = n === 0;
      if (r2) r2.disabled = n === 0;
      const all = $('#trashPickAll');
      if (all) all.checked = n > 0 && n === items.length;
    };
    document.querySelectorAll('.tpick').forEach((c) => (c.onchange = updateSel));
    if ($('#trashPickAll')) {
      $('#trashPickAll').onchange = (e) => {
        document.querySelectorAll('.tpick').forEach((c) => { c.checked = e.target.checked; });
        updateSel();
      };
    }

    $('#restorePicked').onclick = async () => {
      const ids = tpicked();
      if (!ids.length) return;
      const rr = await INVOKE('trash:restore', { ids });
      toast(rr.ok ? rr.message : rr.error, rr.ok ? 'okc' : 'err');
      load();
    };
    $('#purgePicked').onclick = async () => {
      const ids = tpicked();
      if (!ids.length) return;
      const imp = await INVOKE('questions:deleteImpact', { ids });
      const it = imp.impact || {};
      const warn = [
        `彻底删除选中的 ${ids.length} 道题？不可恢复。`,
        '',
        it.attempts ? `· 会一并删除 ${it.attempts} 条作答记录` : '· 这些题没有作答记录',
        it.answered ? `· 其中 ${it.answered} 道练过，复习进度会丢失` : '',
      ].filter(Boolean).join('\n');
      if (!confirm(warn)) return;
      const rr = await INVOKE('trash:purge', { ids });
      toast(rr.ok ? rr.message : rr.error, rr.ok ? 'okc' : 'err');
      load();
    };
    $('#emptyTrash').onclick = async () => {
      if (!confirm('清空回收站会彻底删除里面所有题目，不可恢复。确定吗？')) return;
      const rr = await INVOKE('trash:empty', {});
      toast(rr.ok ? rr.message : rr.error, rr.ok ? 'okc' : 'err');
      load();
    };

    updateSel();
  };

  await load();
};
